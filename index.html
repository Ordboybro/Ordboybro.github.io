<style id="ed-boot-style">:root{color-scheme:dark}html,body{margin:0;min-height:100%;background:#070707;color:#fff}#ed-boot{min-height:100dvh;display:grid;place-items:center;font:900 22px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:-.03em}#ed-boot span{color:#ff8a18}</style>
<style id="emoji-drops-110-ui">
/* 11/10 visual pass — hierarchy, depth, touch, premium surfaces. No new controls. */
:root{--ed-orange:#ff8a18;--ed-gold:#ffbd62;--ed-panel:#101010;--ed-panel2:#151515;--ed-line:#292929;--ed-ease:cubic-bezier(.22,1,.36,1)}
body{background:radial-gradient(900px 420px at 50% -180px,#ff8a180c,transparent 70%),#070707}
header{background:rgba(8,8,8,.82)!important;border-bottom-color:#252525!important}

main{padding-top:28px}
.section-title{letter-spacing:.11em}
.case-card{background:radial-gradient(300px 180px at 50% 20%,#ff8a0015,transparent 65%),linear-gradient(145deg,#181818,#0d0d0d)!important;border-color:#2d2d2d!important}
.case-card:hover{border-color:#ff9b38!important;box-shadow:0 22px 55px #000,0 0 35px #ff8a0014!important}
.live-section{padding:16px 0 4px}
.live-title{display:flex;align-items:center;gap:8px}
.live-title span{font-size:12px;text-shadow:0 0 12px #ff8a18}
.live-container{padding:7px 3px 14px!important}
.live-drop{background:linear-gradient(145deg,#171717,#0d0d0d)!important}
.profile-layout{gap:24px!important}
.profile-center{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 10%,#ff9b3022,transparent 45%),linear-gradient(145deg,#15120f,#0b0b0b)!important;box-shadow:0 22px 70px #000,0 0 45px #ff8a0010}
.profile-center:before{content:"";position:absolute;inset:12px;border:1px solid #ffffff09;border-radius:18px;pointer-events:none}
.avatar{width:100px;height:100px;display:grid;place-items:center;border-radius:30px;background:linear-gradient(145deg,#242424,#0e0e0e);border:1px solid #ff9b3840;box-shadow:inset 0 1px #fff1,0 18px 45px #000;font-size:58px}
.profile-name{font-size:30px!important;letter-spacing:-.03em}
.profile-btn{background:linear-gradient(145deg,#191919,#101010)!important;box-shadow:inset 0 1px #fff1,0 10px 25px #0008}
.profile-btn.reward{box-shadow:0 12px 30px #ff7b002b,inset 0 1px #fff4!important}
.stats{gap:10px!important}
.stat{background:linear-gradient(145deg,#181818,#0e0e0e)!important;box-shadow:inset 0 1px #fff1,0 12px 28px #0007}
.stat b{font-variant-numeric:tabular-nums}
.best{background:linear-gradient(145deg,#19140d,#0d0d0d)!important;box-shadow:0 14px 34px #0008,inset 0 1px #fff1}
.inventory-item{background:linear-gradient(145deg,#181818,#0d0d0d)!important;box-shadow:inset 0 1px #fff1,0 10px 25px #0007}
.upgrade-panel{background:radial-gradient(circle at 50% 50%,#ff8a0010,transparent 35%)}
.upgrade-slot{background:linear-gradient(145deg,#191919,#0d0d0d)!important;box-shadow:inset 0 1px #fff1,0 16px 38px #0008}
.upgrade-arrow{width:92px!important;height:92px!important;box-shadow:0 0 35px #ff7b0044,inset 0 0 25px #ff7b0028!important}
.upgrade-mult{min-width:74px;min-height:44px}
.upgrade-target{background:linear-gradient(145deg,#181818,#0d0d0d)!important}
.upgrade-target:hover{transform:translateY(-2px);border-color:#8f5b25}
.case-reel{border-color:#3c3025!important;box-shadow:inset 0 0 45px #ff7b0012,0 14px 35px #0008!important}
.reel-item{background:linear-gradient(145deg,#181818,#0c0c0c)!important}
.reel-marker{width:4px!important}
.modal{background:#000d!important}
.panel{background:linear-gradient(145deg,#151515,#0b0b0b)!important;border-color:#353535!important}
.panel-head{background:rgba(14,14,14,.78);backdrop-filter:blur(14px)}
@media(max-width:700px){main{padding:18px 14px 60px}.profile-center{min-height:210px}.profile-layout{gap:12px!important}.avatar{width:84px;height:84px;font-size:48px}.profile-name{font-size:25px!important}.stats{gap:8px!important}.stat{padding:15px}.stat b{font-size:25px}.upgrade-panel{gap:11px}.upgrade-arrow{width:74px!important;height:74px!important}}
@media(prefers-reduced-motion:reduce){.profile-center:after{animation:none!important}.case-card,.profile-btn,.inventory-item,.upgrade-target{transition:none!important}}
</style>
<style id="emoji-drops-phase1-polish">
/* Phase pass: mobile stability + existing-surface polish. No new controls. */
:root{--ed-focus:#ff9a3d}
button,a,input,select,textarea{outline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ed-focus);outline-offset:3px}
.top-pill{font-variant-numeric:tabular-nums;white-space:nowrap}
.case-card{isolation:isolate}
.case-card:after{content:"";position:absolute;inset:1px;border-radius:23px;pointer-events:none;background:linear-gradient(180deg,#fff08,transparent 28%);opacity:.45}
.case-card>*{position:relative;z-index:1}
.case-art{filter:drop-shadow(0 12px 24px #000b);transition:transform .24s var(--ed-ease),filter .24s var(--ed-ease)}
.case-card:hover .case-art{transform:translateY(-3px) scale(1.025);filter:drop-shadow(0 16px 30px #000)}
.case-price span{font-variant-numeric:tabular-nums;text-shadow:0 0 18px #ff8a1833}
.live-container{scrollbar-width:none;-webkit-overflow-scrolling:touch}
.live-container::-webkit-scrollbar{display:none}
.live-drop{min-width:0;box-shadow:0 8px 24px #0008,inset 0 1px #fff1}
.primary,.secondary,.profile-btn,.reel-fast,.amount,.upgrade-mult,.close{min-height:48px}
.primary,.secondary{display:inline-flex;align-items:center;justify-content:center}
.modal{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.panel{max-height:min(92dvh,900px)}
.panel-body{padding-bottom:max(24px,env(safe-area-inset-bottom))}
@media(max-width:430px){
  header{height:64px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}

  .top-pill{padding:9px 10px;font-size:14px}
  .profile-top{max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:9px 10px}
  main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .cases{gap:10px}
  .case-card{border-radius:19px;padding:14px 8px 12px;min-height:218px;height:auto}
  .case-art{height:86px;font-size:54px}
  .case-name{font-size:18px}
  .case-meta{font-size:13px}
  .case-price span{font-size:18px}
  .live-drop{flex-basis:150px;height:60px}
  .panel{width:100%;border-radius:20px}
  .panel-head{padding:16px}
  .panel-head h2{font-size:19px}
  .panel-body{padding:15px}
  .case-reel{height:104px}
  .reel-item{flex-basis:78px;height:80px}
  .reel-item strong{font-size:30px}
  .win-card{padding:22px 14px}
  .win-card .emoji{font-size:76px}
}
@media(max-width:340px){
  .cases{grid-template-columns:1fr;max-width:290px;margin-inline:auto}
  .case-card{min-height:205px}
  .case-art{height:72px}
  .top-pill{font-size:13px}
  .profile-top{max-width:39vw}
}
@media(orientation:landscape) and (max-height:520px){
  header{height:58px}
  main{padding-top:12px;padding-bottom:30px}
  .panel{max-height:96dvh}
  .panel-head{padding:12px 16px}
  .panel-body{padding:14px 16px}
  .case-reel{height:90px}
  .win-card{padding:14px}
  .win-card .emoji{font-size:58px}
}
@media(prefers-reduced-motion:reduce){
  .case-card,.case-art,.live-drop,.primary,.secondary,.profile-btn,.upgrade-target{transition:none!important;animation:none!important}
}
</style><style id="emoji-drops-phase2-polish">
/* Phase 2: premium surface polish + mobile stability. Existing UI only; no new controls. */
:root{--ed-ease-premium:cubic-bezier(.22,1,.36,1)}
header{isolation:isolate}
header .logo{transition:transform .22s var(--ed-ease-premium),text-shadow .22s var(--ed-ease-premium)}
header .logo:hover{transform:translateY(-1px);text-shadow:0 0 30px #ff8a1830}
.top-pill,.profile-top{min-height:48px}
.top-pill{display:flex;align-items:center;justify-content:center}
.primary,.secondary,.profile-btn,.profile-top,.close,.amount,.upgrade-mult,.reel-fast{min-height:48px;-webkit-tap-highlight-color:transparent}
.case-card,.inventory-item,.upgrade-target,.preview-item,.stat,.best,.setting,.panel{backface-visibility:hidden}
.case-card{content-visibility:visible}
.live-drop{will-change:transform}
.panel{overscroll-behavior:contain}
.modal{overscroll-behavior:contain}
.case-reel-track{transform:translateZ(0)}
@media(max-width:700px){

  .live-container{touch-action:pan-x;overscroll-behavior-x:contain}
  .panel{border-radius:20px!important}
  .panel-head{padding-top:max(16px,env(safe-area-inset-top));}
}
@media(max-width:340px){
  .cases{grid-template-columns:1fr!important;max-width:300px;margin-inline:auto}
  .case-card{min-height:205px!important;height:205px!important}
  .case-art{height:72px!important;font-size:52px!important}
  .case-name{font-size:17px!important}
}
@media(orientation:landscape) and (max-height:520px){
  .case-card{min-height:190px!important;height:190px!important}

@media(prefers-reduced-motion:reduce){
  header .logo,.case-card,.case-art,.live-drop,.primary,.secondary,.profile-btn,.profile-top,.close,.amount,.upgrade-mult,.reel-fast{transition:none!important}

}
