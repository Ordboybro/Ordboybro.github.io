<title>Emoji Drops</title>
<style>
:root{--bg:#090909;--card:#121212;--line:#292929;--text:#fff;--muted:#8b8b8b;--orange:#ff7b00;--orange2:#ff9a2e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit}.hidden{display:none!important}.modal-lock{overflow:hidden}
header{height:76px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(12,12,12,.96);backdrop-filter:blur(14px);border-bottom:1px solid #222}.logo{font-size:25px;font-weight:900}.logo span{color:var(--orange)}.top-right{display:flex;align-items:center;gap:10px}.top-pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}.profile-top{border:1px solid #333;background:#151515;border-radius:16px;padding:10px 14px}.profile-top:hover{border-color:var(--orange)}.reward-top{border:1px solid var(--orange);background:linear-gradient(135deg,#ff7b00,#ff9a2e);border-radius:14px;padding:10px 13px;font-weight:900}
main{max-width:1240px;margin:0 auto;padding:22px 24px 150px}.section-title{font-size:18px;font-weight:900;letter-spacing:.08em;margin:18px 0 12px;color:#ddd}.cases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.case-card{width:100%;height:245px;position:relative;overflow:hidden;text-align:center;background:linear-gradient(180deg,#171717,#101010);border:1px solid #2b2b2b;border-radius:24px;padding:20px 18px 16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.case-card:hover{transform:translateY(-4px);border-color:var(--orange)}.case-art{font-size:76px;height:130px;width:100%;display:grid;place-items:center}.case-info{width:100%;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.case-name{font-size:22px;font-weight:900}.case-meta{font-size:15px;color:#aaa}.case-price{display:flex;align-items:center;justify-content:center}.case-price span{color:var(--orange2);font-size:21px;font-weight:900}
.live-section{margin-top:24px}.live-title{font-size:16px;font-weight:900;letter-spacing:.06em;color:#ddd;margin-bottom:10px}.live-title span{color:var(--orange)}.live-container{display:flex;gap:10px;width:100%;overflow-x:auto;padding:4px 2px 10px}.live-drop{flex:0 0 165px;height:62px;display:flex;align-items:center;gap:10px;padding:8px 10px;background:#131313;border:1px solid var(--rarity,#888);border-radius:15px}.live-emoji{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#0d0d0d;font-size:25px}.live-drop b{display:block;font-size:13px}.live-drop span{display:block;color:var(--rarity,#aaa);font-size:10px;font-weight:900;margin-top:4px}
.modal{position:fixed;inset:0;z-index:100;background:#000b;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.panel{width:min(920px,96vw);max-height:92vh;overflow:auto;background:#111;border:1px solid #333;border-radius:26px;box-shadow:0 30px 100px #000;position:relative}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid #292929}.panel-head h2{margin:0;font-size:22px}.close{width:40px;height:40px;border:1px solid #333;border-radius:12px;background:#1a1a1a}.panel-body{padding:24px}.primary{border:1px solid var(--orange);background:linear-gradient(135deg,#ff7b00,#ff9a2e);padding:13px 20px;border-radius:13px;font-weight:900;color:white}.secondary{border:1px solid #333;background:#171717;padding:13px 20px;border-radius:13px;font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap}.field{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #333;background:#0d0d0d;color:white;margin-bottom:10px}
@media(max-width:900px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){header{padding:0 14px}.top-right{gap:6px}.top-pill{padding:10px 9px}.reward-top{padding:10px 9px}.cases{gap:12px}.case-card{height:230px;border-radius:20px;padding:16px 10px}.case-art{font-size:64px}.panel{width:100%;max-height:94vh}.panel-body{padding:18px}}@media(max-width:340px){.cases{grid-template-columns:1fr}.reward-top{display:none}}
</style>
</head>
<body>
<header><div class="logo">Emoji <span>Drops</span></div><div class="top-right"><div class="top-pill"><span id="onlineCount">128</span> online</div><div class="top-pill">💰 <span id="balance">350</span>₽</div><button id="rewardHeader" class="reward-top" type="button">🎁 Получить 100₽</button><button id="profileBtn" class="profile-top" type="button">👤 <span id="nickname">Гость</span></button></div></header>
<main>
<section id="cases" class="cases" aria-label="Кейсы"></section>
<section class="live-section"><div class="live-title"><span>●</span> LIVE DROPS</div><div id="liveContainer" class="live-container"></div></section>
</main>
