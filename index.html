<style>
:root{--bg:#090909;--card:#121212;--line:#292929;--text:#fff;--muted:#8b8b8b;--orange:#ff7b00;--orange2:#ff9a2e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:not-allowed;opacity:.7}.hidden{display:none!important}.modal-lock{overflow:hidden}
header{height:76px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(12,12,12,.92);backdrop-filter:blur(14px);border-bottom:1px solid #222}.logo{font-size:25px;font-weight:900}.logo span{color:var(--orange)}.top-right{display:flex;align-items:center;gap:14px}.top-pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}.balance-menu{position:relative}.balance-menu:hover .reward-pop{opacity:1;transform:translate(-50%,0);pointer-events:auto}.reward-pop{position:absolute;top:58px;left:50%;transform:translate(-50%,-5px);opacity:0;pointer-events:none;transition:.2s;padding:8px;background:#111;border:1px solid #333;border-radius:15px;z-index:100}.reward-btn{min-width:150px;border:1px solid var(--orange);background:linear-gradient(135deg,#ff7b00,#ff9b32);padding:10px 14px;border-radius:12px;font-weight:800}.profile-top{border:1px solid #333;background:#151515;border-radius:16px;padding:10px 14px}.profile-top:hover{border-color:var(--orange)}
main{max-width:1240px;margin:0 auto;padding:22px 24px 150px}.section-title{font-size:18px;font-weight:900;letter-spacing:.08em;margin:18px 0 12px;color:#ddd}.cases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.case-tile{min-width:0}.case-card{width:100%;height:245px;min-height:245px;position:relative;overflow:hidden;text-align:center;background:linear-gradient(180deg,#171717,#101010);border:1px solid #2b2b2b;border-radius:24px;padding:20px 18px 16px;transition:transform .22s,border-color .22s,box-shadow .22s;box-shadow:0 8px 30px #0006;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.case-card:before{content:"";position:absolute;inset:-60%;background:radial-gradient(circle,#ff7b0015,transparent 58%);pointer-events:none}.case-card:hover{transform:translateY(-5px);border-color:var(--orange);box-shadow:0 0 0 1px #ff7b0033,0 18px 45px #000}.case-art{position:relative;font-size:76px;height:120px;width:100%;display:grid;place-items:center;filter:drop-shadow(0 10px 20px #000);flex:1}.case-info{width:100%;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.case-name{font-size:22px;font-weight:900;position:relative}.case-meta{font-size:15px;color:#aaa}.case-price{display:none!important}
.live-section{margin-top:24px}.live-title{font-size:16px;font-weight:900;letter-spacing:.06em;color:#ddd;margin-bottom:10px}.live-title span{color:var(--orange)}.live-container{display:flex;flex-direction:row;gap:10px;width:100%;overflow-x:auto;scrollbar-width:none;padding:4px 2px 10px}.live-container::-webkit-scrollbar{display:none}.live-drop{--rarity:#9ca3af;flex:0 0 165px;height:62px;display:flex;align-items:center;gap:10px;padding:8px 10px;background:#131313;border:1px solid var(--rarity);border-radius:15px;box-shadow:0 5px 20px #0006}.live-emoji{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#0d0d0d;border:1px solid var(--rarity);font-size:25px}.live-drop b{display:block;font-size:13px}.live-drop span{display:block;color:var(--rarity);font-size:10px;font-weight:900;margin-top:4px}
.modal{position:fixed;inset:0;z-index:100;background:#000b;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.panel{width:min(920px,96vw);max-height:92vh;overflow:auto;background:#111;border:1px solid #333;border-radius:26px;box-shadow:0 30px 100px #000;position:relative}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid #292929}.panel-head h2{margin:0;font-size:22px}.close{width:40px;height:40px;border:1px solid #333;border-radius:12px;background:#1a1a1a}.close:hover{border-color:var(--orange)}.panel-body{padding:24px}.primary{border:1px solid var(--orange);background:linear-gradient(135deg,#ff7b00,#ff9a2e);padding:13px 20px;border-radius:13px;font-weight:900;color:white}.secondary{border:1px solid #333;background:#171717;padding:13px 20px;border-radius:13px;font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap}.amounts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.amount{width:42px;height:42px;border:1px solid #333;background:#171717;border-radius:11px}.amount.active,.amount:hover{border-color:var(--orange);background:#2a190d}.open-cost{color:var(--orange2);font-weight:900}.case-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:10px;margin-top:18px}.preview-item{--rarity:#9ca3af;border:1px solid var(--rarity);border-radius:14px;background:#151515;padding:12px;text-align:center}.preview-item strong{font-size:32px;display:block}.preview-item span{display:block;color:var(--rarity);font-size:9px;font-weight:900;margin-top:7px}.preview-item small{display:block;margin-top:5px;color:#aaa}.inventory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.inventory-item{--rarity:#9ca3af;border:1px solid var(--rarity);border-radius:16px;padding:16px;background:#151515;text-align:center}.inv-emoji{font-size:50px}.inventory-item small{display:block;color:var(--rarity);font-weight:900;margin:5px}.inventory-item button{width:100%;border:1px solid #333;background:#1c1c1c;border-radius:10px;padding:8px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid #333;border-radius:16px;padding:20px;background:#151515}.stat b{font-size:30px;color:var(--orange2);display:block;margin-top:7px}.profile-layout{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:18px;align-items:center}.profile-center{text-align:center;padding:28px;border:1px solid var(--orange);border-radius:24px;background:radial-gradient(circle at 50% 0,#ff7b0018,transparent 60%),#0d0d0d;position:relative}.profile-gear{position:absolute;left:14px;top:14px;width:52px;height:52px;border:1px solid var(--orange);border-radius:14px;background:#171717;font-size:24px}.avatar{font-size:70px}.profile-name{font-size:28px;font-weight:900;margin-top:8px}.profile-side{display:flex;flex-direction:column;gap:10px}.profile-btn{min-height:52px;border:1px solid var(--orange);background:#171717;border-radius:14px;padding:0 15px;font-weight:900}.profile-btn.reward{background:linear-gradient(135deg,#ff7b00,#ff9a2e);border-color:#ff9a2e}.best-wrap{margin-top:24px;text-align:center}.best{--rarity:#9ca3af;display:inline-flex;align-items:center;gap:12px;border:1px solid var(--rarity);border-radius:18px;padding:12px 18px;background:#151515}.best strong{font-size:38px}.inventory{margin-top:26px}.settings-list{display:grid;gap:12px}.field{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #333;background:#0d0d0d;color:white;margin-bottom:10px}.danger{border-color:#ef4444!important;background:#241010!important}.muted{color:#777}.auth{width:min(430px,96vw)}
.ed-final-reels{display:grid;gap:10px;margin-bottom:14px}.ed-final-reel{position:relative;height:116px;overflow:hidden;border:1px solid #303030;border-radius:18px;background:#0d0d0d}.ed-final-track{height:100%;display:flex;align-items:center;gap:8px;padding:0 10px;will-change:transform}.ed-final-item{flex:0 0 92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--rarity);border-radius:14px;background:#151515}.ed-final-item strong{font-size:34px}.ed-final-item small{font-size:9px;color:var(--rarity);font-weight:900}.ed-final-marker{position:absolute;z-index:2;left:50%;top:0;bottom:0;width:3px;background:#ff8a00;box-shadow:0 0 14px #ff8a00;transform:translateX(-50%)}.ed-final-win-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px;max-height:58vh;overflow:auto}.ed-final-win{border:1px solid var(--rarity);border-radius:13px;background:#151515;padding:10px;text-align:center}.ed-final-win strong{display:block;font-size:40px}.ed-final-win b{display:block;color:var(--rarity);font-size:10px}.ed-final-win small{display:block;color:#999;margin-top:4px}.ed-final-upgrade{display:grid;grid-template-columns:minmax(0,1fr) 180px minmax(0,1fr);gap:14px}.ed-final-box{border:1px solid #303030;border-radius:18px;background:#151515;padding:12px}.ed-final-items{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:170px;overflow:auto;margin-top:9px}.ed-final-item-btn{border:1px solid #333;background:#111;border-radius:9px;padding:5px;text-align:center}.ed-final-item-btn.selected{border-color:#ff7b00;background:#26170c}.ed-final-item-btn strong{display:block;font-size:25px}.ed-final-item-btn small{color:#999;font-size:10px}.ed-final-wheel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.ed-final-wheel-circle{width:145px;height:145px;border-radius:50%;display:grid;place-items:center;background:#111;border:3px solid #ff7b00;box-shadow:0 0 28px #ff7b0033;font-size:42px}.ed-final-mults{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:100%}.ed-final-mults button{border:1px solid #333;background:#171717;border-radius:8px;padding:7px 2px}.ed-final-mults button.active{border-color:#ff7b00;color:#ff9d3d}.ed-final-chance{font-size:12px;font-weight:900;color:#ff9d3d;text-align:center}
@media(max-width:900px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}.profile-layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.ed-final-upgrade{grid-template-columns:1fr}.ed-final-wheel{order:2}.ed-final-box.target{order:3}.ed-final-box.source{order:1}}@media(max-width:700px){header{padding:0 14px}.top-right{gap:8px}.top-pill{padding:10px 11px}.cases{gap:12px}.case-card{height:245px;min-height:245px;border-radius:20px;padding:18px 12px 14px}.case-art{font-size:64px}.panel{width:100%;max-width:100%;max-height:94vh}.panel-body{padding:18px}.live-drop{flex-basis:155px}}@media(max-width:340px){.cases{grid-template-columns:1fr}.case-card{height:230px;min-height:230px}}
