<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Drops</title>
<script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>window.addEventListener("DOMContentLoaded", () => { emailjs.init({ publicKey:"aevTrSnp2VVPi1u3_" }); });</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/updates.css">
<link rel="stylesheet" href="css/polish.css">
</head>
<body>
<header>
<div class="logo"><img src="logo.png" class="logo-img"><div class="logo-text"><span>Emoji</span><p>Drops</p></div></div>
<div class="top-right">
<div class="top-btn online-box"><div class="online-dot"></div><span id="onlineCount">128</span> online</div>
<div class="balance-menu"><div class="top-btn">💰 <span id="balance">1000</span>₽</div><div class="balance-dropdown"><button>ПОПОЛНИТЬ</button></div></div>
<div class="profile-menu"><div class="profile-box"><div class="user">👤</div><div class="nickname" id="nickname">Гость</div></div><div class="profile-dropdown" id="profileDropdown"><button onclick="openAuth('login')" id="loginBtn">Войти</button><button onclick="openAuth('register')" id="registerBtn">Регистрация</button><button onclick="openProfile()" id="profileBtn" style="display:none;">Профиль</button><button onclick="logout()" id="logoutBtn" style="display:none;">Выйти</button></div></div>
</div>
</header>
<div class="top-line"></div>
<div class="search-wrap"><input class="search" id="searchInput" placeholder="Поиск кейсов..." onkeyup="searchCases()"></div>
<div class="cases">
<div class="case" onclick="openCasePage('smile')"><div class="case-emoji">😀</div><div class="case-name">Smile</div><div class="case-price"><div class="old-price">200₽</div><div class="new-price">100₽</div></div></div>
<div class="case" onclick="openCasePage('moves')"><div class="case-emoji">🕺</div><div class="case-name">Moves</div><div class="case-price"><div class="new-price">80₽</div></div></div>
<div class="case" onclick="openCasePage('nature')"><div class="case-emoji">🌿</div><div class="case-name">Nature</div><div class="case-price"><div class="new-price">60₽</div></div></div>
<div class="case" onclick="openCasePage('food')"><div class="case-emoji">🍔</div><div class="case-name">Food</div><div class="case-price"><div class="new-price">40₽</div></div></div>
<div class="case" onclick="openCasePage('animals')"><div class="case-emoji">🐶</div><div class="case-name">Animals</div><div class="case-price"><div class="new-price">20₽</div></div></div>
<div class="case" onclick="openCasePage('transport')"><div class="case-emoji">🚗</div><div class="case-name">Transport</div><div class="case-price"><div class="old-price">30₽</div><div class="new-price">10₽</div></div></div>
<div class="case" onclick="openCasePage('sport')"><div class="case-emoji">⚽</div><div class="case-name">Sport</div><div class="case-price"><div class="new-price">250₽</div></div></div>
<div class="case" onclick="openCasePage('games')"><div class="case-emoji">🎮</div><div class="case-name">Games</div><div class="case-price"><div class="new-price">500₽</div></div></div>
</div>
<div class="open-page" id="openPage"><button class="back-btn" onclick="closePage()">← Назад</button><div class="open-header"><div class="logo"><img src="logo.png" class="logo-img"><div class="logo-text"><span>Emoji</span><p>Drops</p></div></div></div><div class="roulette-wrapper"><div class="roulette"><div class="center-indicator"></div><div id="multiRouletteContainer"></div></div></div><div class="open-amounts" id="openAmounts"></div><div class="open-buttons"><button class="main-btn" onclick="openCase()">Открыть кейс<div class="btn-subtext">100₽</div></button><button class="main-btn fast-btn">Быстро</button></div><div class="case-items-list" id="caseItemsList"></div></div>
<div class="win-popup" id="winPopup"><div class="win-box"><div class="confetti">🎉 🎊 ✨ 🎉</div><div class="win-emoji" id="winEmoji">😀</div><div class="win-rarity" id="winRarity">COMMON</div><div class="win-price" id="winPrice">10₽</div><button onclick="takeWin()">ЗАБРАТЬ</button><button onclick="sellWin()" style="margin-top:15px;background:#242424;">ПРОДАТЬ</button></div></div>
<div class="live-drops-bar live-drops-floating"><div class="live-title">🔥 LIVE DROPS</div><div class="live-container" id="liveContainer"></div></div>
<div class="auth-popup" id="authPopup"><div class="auth-box"><div class="auth-title" id="authTitle">Вход</div><input type="email" id="authEmail" class="auth-input" placeholder="Почта"><input type="password" id="authPassword" class="auth-input" placeholder="Пароль"><button class="auth-btn" onclick="submitAuth()">Продолжить</button><button class="auth-btn close-auth" onclick="closeAuth()">Закрыть</button></div></div>
<script src="js/bootstrap.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/ui-shell.js"></script>
<script src="js/ui-actions.js"></script>
<script src="js/updates.js"></script>
<script src="js/final-fixes.js"></script>
<script src="js/ui-polish.js"></script>
</body>
</html>
