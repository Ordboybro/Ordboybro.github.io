/* CHANCES */

function getRandomByChance(items){

    const rand =
    Math.random() * 100;

    let rarity;

    if(rand <= 3){

        rarity = "legendary";

    }else if(rand <= 8){

        rarity = "mythical";

    }else if(rand <= 25){

        rarity = "epic";

    }else if(rand <= 55){

        rarity = "rare";

    }else{

        rarity = "common";
    }

const filtered =
items.filter(
item => item.rarity === rarity
);

if(filtered.length === 0){

    return items[
        Math.floor(
        Math.random() * items.length
        )
    ];
}

return filtered[
Math.floor(
Math.random() *
filtered.length
)
];
}

function updateBestDrop(){

    if(
        !state.currentUser ||
        !state.currentUser.inventory ||
        state.currentUser.inventory.length === 0

        "bestDropEmoji"
        ).innerText = "🏆";

        document.getElementById(
        "bestDropRarity"
        ).innerText = "Нет дропа";

        return;
    }

    const rarityOrder = {
        common:1,
        rare:2,
        epic:3,
        mythical:4,
        legendary:5
    };

const inventory = state.currentUser.inventory || [];

if (inventory.length === 0) {
    document.getElementById("bestDropEmoji").innerText = "🏆";
    document.getElementById("bestDropRarity").innerText = "Нет дропа";
    return;
}

const best = [...inventory].sort(
    (a,b)=> rarityOrder[b.rarity] - rarityOrder[a.rarity]
)[0];

    document.getElementById(
    "bestDropEmoji"
    ).innerText =
    best.emoji;

    document.getElementById(
    "bestDropRarity"
    ).innerText =
    best.rarity.toUpperCase();

    document.getElementById(
    "bestDropRarity"
    ).style.color =
    rarities[best.rarity].color;
}

/* SPIN */

async function openCase(count = state.openAmount) {
    if (state.isSpinning) return;
    if (!state.selectedCase) return alert("Выберите кейс");
    if (!state.currentUser) return openAuth("login");

    const price = casePrices[state.selectedCase] * count;

    if (state.balance < price) {
        return alert("Недостаточно средств");
    }

    state.isSpinning = true;

    // списываем баланс
state.currentUser.balance -= price;
state.balance = state.currentUser.balance;

saveUsers();
updateBalanceUI();

    const wins = [];

    for (let i = 0; i < count; i++) {
        const item = getRandomByChance(state.currentCase);
        wins.push(item);

        if (!state.currentUser.inventory) {
            state.currentUser.inventory = [];
        }

        state.currentUser.inventory.push(item);

        addLiveDrop(state.currentUser.nickname, item);
    }

    // статистика
    state.stats.opened += count;
    saveStats();

    saveUsers();
    renderInventory();

    state.isSpinning = false;

    // показываем последний выигрыш
    state.winQueue = wins;
    showNextWin();
}

function sellInventoryItem(index){

    if(!state.currentUser) return;

    const item = state.currentUser.inventory[index];
    if(!item) return;

    const value = Number((item.price || "0").replace(/[^\d]/g, ""));

state.balance += value;
state.currentUser.balance = state.balance;

    state.stats.withdrawnItems += 1; // 🔥 FIX

    saveStats();
    saveBalance();

    state.currentUser.inventory.splice(index, 1);

    updateBalanceUI();
    saveUsers();
    renderInventory();
    updateBestDrop();
}

function saveUsers(){

    if(!state.currentUser) return;

    let users = JSON.parse(
        localStorage.getItem("users")
    ) || [];

    const index = users.findIndex(
        u => u.email === state.currentUser.email
    );

    if(index !== -1){

    users[index] = {
    ...users[index],
    ...state.currentUser
};

}else{

    users.push(state.currentUser);
}

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );
}

function openAuth(mode){
    state.authMode = mode;

    document.getElementById("authPopup").style.display = "flex";

    document.getElementById("authTitle").innerText =
        mode === "login" ? "Вход" : "Регистрация";
}

function closeAuth(){

    document.getElementById(
    "authPopup"
    ).style.display = "none";
}

function sendVerificationCode(email){

    state.generatedCode =
    Math.floor(
    100000 + Math.random() * 900000
    );

    emailjs.send(
    "service_9okzrkg",
    "template_arn6e7i",
    {
        to_email: email,
        code: state.generatedCode
    })

    .then(() => {

        closeAuth();

        document.getElementById(
        "verifyPopup"
        ).style.display = "flex";
    });
}

function submitAuth(){

    const email =
    document.getElementById(
    "authEmail"
    ).value.trim();

    const password =
    document.getElementById(
    "authPassword"
    ).value.trim();

    if(!email || !password){

        alert("Заполните поля");
        return;
    }

    if(password.length < 8){

        alert("Минимум 8 символов");
        return;
    }

    let users =
    JSON.parse(
    localStorage.getItem("users")
    ) || [];

    /* LOGIN */

    if(state.authMode === "login"){

        const user =
        users.find(
        u =>
        u.email === email &&
        u.password === password
        );

        if(!user){

            alert("Неверные данные");
            return;
        }

        state.pendingUser = user;

        if(user.twofa){

        sendVerificationCode(email);
        return;
        }

    }else{

        /* REGISTER */

        const exists =
        users.find(
        u => u.email === email
        );

        if(exists){

            alert("Аккаунт уже существует");
            return;
        }

        state.pendingUser = {
            
            twofa:false,

            email,
            password,

            nickname:
            "user" +
            Math.floor(
            Math.random() * 1000
            ),

            balance:1000,

            inventory:[]
        };
    }

    state.generatedCode =
    Math.floor(
    100000 + Math.random() * 900000
    );

    emailjs.send(
    "service_9okzrkg",
    "template_arn6e7i",
    {
        to_email: email,
        code: state.generatedCode
    })

    .then(() => {

        closeAuth();

        document.getElementById(
        "verifyPopup"
        ).style.display = "flex";

        alert("Код отправлен");

    })

.catch((error) => {

    console.log(error);

    alert("Ошибка отправки email кода");

});
}

function openDeleteConfirm(){

    document.getElementById(
    "deleteConfirm"
    ).style.display = "flex";
}

function confirmDelete(){

    let users =
    JSON.parse(
    localStorage.getItem("users")
    ) || [];

    users = users.filter(
    u => u.email !== state.currentUser.email
    );

    localStorage.setItem(
    "users",
    JSON.stringify(users)
    );

    logout();

    location.reload();
}

let currentCasePrice = 100;

function selectAmount(amount, event){

    openAmount = amount;

    document.querySelectorAll(".amount-btn")
        .forEach(btn => btn.classList.remove("active"));

    if (event && event.target) {
        event.target.classList.add("active");
    }

    updateOpenPrice();
}

function syncBalance(){

    if(!state.currentUser) return;

    state.currentUser.balance =
    state.balance;

    saveUsers();
}

function updateOpenPrice(){

    const total =
    (casePrices[state.selectedCase] || 0)
    * state.openAmount;

    const el =
    document.querySelector(".btn-subtext");

    if(el){
        el.innerText = total + "₽";
    }
}

function togglePasswordSettings(){

    const content =
    document.getElementById(
    "passwordContent"
    );

    const arrow =
    document.getElementById(
    "passwordArrow"
    );

    content.classList.toggle("open");

    arrow.classList.toggle("rotate");
}

function nextAuthStep(){

    const email =
    document.getElementById(
    "authEmail"
    ).value.trim();

    const password =
    document.getElementById(
    "authPassword"
    ).value.trim();

    if(!email || !password){

        alert("Заполните поля");
        return;
    }

    if(password.length < 8){

        alert("Пароль минимум 8 символов");
        return;
    }

    submitAuth();
}

function loginUser(user){

    state.currentUser = user;

    state.balance = user.balance ?? 1000;
    state.currentUser.balance = state.balance;

    state.currentUser.inventory = state.currentUser.inventory || [];

    state.stats = user.stats ?? {
        opened:0,
        upgrades:0,
        deposited:0,
        withdrawn:0,
        withdrawnItems:0
    };

    updateStatsUI();

    /* LOAD 2FA */

    const toggle =
    document.getElementById("twofaToggle");

    if(toggle){
        toggle.checked = !!user.twofa;
    }

    localStorage.setItem(
        "currentUser",
        user.email
    );

    $("#nickname").innerText = user.nickname;

    updateBalanceUI();

    updateProfileUI(true);

    renderOpenAmounts();
}
