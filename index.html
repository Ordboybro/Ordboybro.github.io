<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emoji Drops</title>
<style>
:root{--bg:#090909;--card:#121212;--line:#292929;--text:#fff;--muted:#8b8b8b;--orange:#ff7b00;--orange2:#ff9a2e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:not-allowed;opacity:.7}.hidden{display:none!important}.modal-lock{overflow:hidden}
header{height:76px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(12,12,12,.92);backdrop-filter:blur(14px);border-bottom:1px solid #222}.logo{font-size:25px;font-weight:900}.logo span{color:var(--orange)}.top-right{display:flex;align-items:center;gap:14px}.top-pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}.balance-menu{position:relative}.balance-menu:hover .reward-pop{opacity:1;transform:translate(-50%,0);pointer-events:auto}.reward-pop{position:absolute;top:58px;left:50%;transform:translate(-50%,-5px);opacity:0;pointer-events:none;transition:.2s;padding:8px;background:#111;border:1px solid #333;border-radius:15px;z-index:100}.reward-btn{min-width:150px;border:1px solid var(--orange);background:linear-gradient(135deg,#ff7b00,#ff9b32);padding:10px 14px;border-radius:12px;font-weight:800}.profile-top{border:1px solid #333;background:#151515;border-radius:16px;padding:10px 14px}.profile-top:hover{border-color:var(--orange)}
main{max-width:1240px;margin:0 auto;padding:22px 24px 80px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.hero h1{font-size:40px;margin:0}.hero p{display:none}.section-title{font-size:18px;font-weight:900;letter-spacing:.08em;margin:18px 0 12px;color:#ddd}.cases{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.case-card{min-height:245px;position:relative;overflow:hidden;text-align:center;background:linear-gradient(180deg,#171717,#101010);border:1px solid #2b2b2b;border-radius:24px;padding:20px 18px 16px;transition:transform .22s,border-color .22s,box-shadow .22s;box-shadow:0 8px 30px #0006}.case-card:before{content:"";position:absolute;inset:-60%;background:radial-gradient(circle,#ff7b0015,transparent 58%);pointer-events:none}.case-card:hover{transform:translateY(-5px);border-color:var(--orange);box-shadow:0 0 0 1px #ff7b0033,0 18px 45px #000}.case-art{position:relative;font-size:76px;height:105px;display:grid;place-items:center;filter:drop-shadow(0 10px 20px #000)}.case-name{font-size:22px;font-weight:900;position:relative}.case-meta{font-size:15px;color:#aaa;margin-top:4px}.case-price{position:static;display:flex;align-items:center;justify-content:center;padding:4px 0 0;border:0;background:transparent}.case-price span{color:var(--orange2);font-size:21px;font-weight:900}.case-price small{display:none}
.live-section{margin-top:24px}.live-title{font-size:16px;font-weight:900;letter-spacing:.06em;color:#ddd;margin-bottom:10px}.live-title span{color:var(--orange)}.live-container{display:flex;flex-direction:row;gap:10px;width:100%;overflow:hidden;padding:4px 2px 10px}.live-drop{--rarity:#9ca3af;flex:0 0 165px;height:62px;display:flex;align-items:center;gap:10px;padding:8px 10px;background:#131313;border:1px solid var(--rarity);border-radius:15px;animation:liveIn .42s cubic-bezier(.2,.8,.2,1);box-shadow:0 5px 20px #0006}.live-emoji{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#0d0d0d;border:1px solid var(--rarity);font-size:25px}.live-drop b{display:block;font-size:13px}.live-drop span{display:block;color:var(--rarity);font-size:10px;font-weight:900;margin-top:4px}.legendary-live{border-color:#ff8a00!important;background:linear-gradient(135deg,#1d1409,#101010);box-shadow:0 0 0 1px #ff8a0033,0 0 22px #ff8a0033}.legendary-live .live-emoji{border-color:#ff8a00;box-shadow:0 0 16px #ff8a0044}@keyframes liveIn{from{opacity:0;transform:translateX(-35px) scale(.96)}to{opacity:1;transform:none}}
.modal{position:fixed;inset:0;z-index:100;background:#000b;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.panel{width:min(920px,96vw);max-height:92vh;overflow:auto;background:#111;border:1px solid #333;border-radius:26px;box-shadow:0 30px 100px #000;position:relative}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid #292929}.panel-head h2{margin:0;font-size:22px}.close{width:40px;height:40px;border:1px solid #333;border-radius:12px;background:#1a1a1a}.close:hover{border-color:var(--orange)}.panel-body{padding:24px}.primary{border:1px solid var(--orange);background:linear-gradient(135deg,#ff7b00,#ff9a2e);padding:13px 20px;border-radius:13px;font-weight:900;color:white}.secondary{border:1px solid #333;background:#171717;padding:13px 20px;border-radius:13px;font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap}.amounts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.amount{width:42px;height:42px;border:1px solid #333;background:#171717;border-radius:11px}.amount.active,.amount:hover{border-color:var(--orange);background:#2a190d}.open-cost{color:var(--orange2);font-weight:900}.case-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:10px;margin-top:18px}.preview-item{--rarity:#9ca3af;border:1px solid var(--rarity);border-radius:14px;background:#151515;padding:12px;text-align:center}.preview-item strong{font-size:32px;display:block}.preview-item span{display:block;color:var(--rarity);font-size:9px;font-weight:900;margin-top:7px}.preview-item small{display:block;margin-top:5px;color:#aaa}.win-card{--rarity:#ff8a00;text-align:center;border:1px solid var(--rarity);border-radius:24px;padding:30px;background:#141414}.win-card .emoji{font-size:100px}.win-card .rarity{color:var(--rarity);font-weight:900;font-size:24px}.win-card .price{color:var(--orange2);font-size:20px;margin:10px}.win-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.win-item{border:1px solid var(--rarity);border-radius:14px;background:#151515;padding:12px}.win-item strong{display:block;font-size:42px}.win-item b{display:block;color:var(--orange2);margin-top:4px}.win-item small{color:#999}
.profile-layout{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:18px;align-items:center}.profile-center{text-align:center;padding:28px;border:1px solid var(--orange);border-radius:24px;background:radial-gradient(circle at 50% 0,#ff7b0018,transparent 60%),#0d0d0d;position:relative}.profile-gear{position:absolute;left:14px;top:14px;width:52px;height:52px;border:1px solid var(--orange);border-radius:14px;background:#171717;font-size:24px}.profile-gear:hover{background:#28180b}.avatar{font-size:70px}.profile-name{font-size:28px;font-weight:900;margin-top:8px}.profile-side{display:flex;flex-direction:column;gap:10px}.profile-btn{min-height:52px;border:1px solid var(--orange);background:#171717;border-radius:14px;padding:0 15px;font-weight:900}.profile-btn:hover{background:#23170c}.profile-btn.reward{background:linear-gradient(135deg,#ff7b00,#ff9a2e);border-color:#ff9a2e}.best-wrap{margin-top:24px;text-align:center}.best{--rarity:#9ca3af;display:inline-flex;align-items:center;gap:12px;border:1px solid var(--rarity);border-radius:18px;padding:12px 18px;background:#151515}.best strong{font-size:38px}.best span{color:var(--rarity);font-weight:900}.inventory{margin-top:26px}.inventory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.inventory-item{--rarity:#9ca3af;border:1px solid var(--rarity);border-radius:16px;padding:16px;background:#151515;text-align:center}.inv-emoji{font-size:50px}.inventory-item small{display:block;color:var(--rarity);font-weight:900;margin:5px}.inventory-item button{width:100%;border:1px solid #333;background:#1c1c1c;border-radius:10px;padding:8px;margin-top:8px}.inventory-item button:hover{border-color:var(--orange)}
.settings-list{display:grid;gap:12px}.setting{display:flex;align-items:center;justify-content:space-between;border:1px solid #2c2c2c;border-radius:16px;background:#151515;padding:16px}.setting input{background:#0d0d0d;border:1px solid #333;color:#fff;border-radius:10px;padding:10px}.danger{border-color:#ef4444!important;background:#241010!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid #333;border-radius:16px;padding:20px;background:#151515}.stat b{font-size:30px;color:var(--orange2);display:block;margin-top:7px}.upgrade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.upgrade-item{border:1px solid #333;background:#171717;border-radius:14px;padding:15px;font-size:35px}.upgrade-item span{display:block;font-size:12px;color:#aaa}.upgrade-item.selected{border-color:var(--orange);box-shadow:0 0 0 2px #ff7b0033}.upgrade-panel{display:grid;grid-template-columns:minmax(0,1fr) 100px minmax(0,1fr);gap:16px;align-items:center}.upgrade-slot{min-height:185px;border:1px solid #303030;border-radius:20px;background:linear-gradient(180deg,#181818,#101010);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.u-emoji{font-size:68px}.u-rarity{font-size:10px;font-weight:900;color:var(--rarity)}.u-value{font-size:20px;font-weight:900;color:#ff9d3d}.upgrade-arrow{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;border:2px solid #ff7b00;background:radial-gradient(circle,#2a190d 0 48%,#160f09 49% 70%,#ff7b0018 71%);color:#ff9d3d;font-size:30px;box-shadow:0 0 25px #ff7b0033,inset 0 0 18px #ff7b0022}.upgrade-mults{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}.upgrade-mult{border:1px solid #333;background:#171717;border-radius:10px;padding:9px 14px;font-weight:900}.upgrade-mult.active{border-color:#ff7b00;background:#26170c;color:#ff9d3d}.upgrade-chance{text-align:center;color:#ff9d3d;font-weight:900}.upgrade-targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:8px;margin-top:14px;max-height:230px;overflow:auto}.upgrade-target{border:1px solid #303030;background:#151515;border-radius:12px;padding:9px;text-align:center}.upgrade-target.selected{border-color:#ff7b00;box-shadow:0 0 0 2px #ff7b0022}.upgrade-target strong{display:block;font-size:29px}.upgrade-target small{color:#999}.case-reels{display:grid;gap:11px;margin:0 0 16px}.case-reel{position:relative;height:116px;overflow:hidden;border:1px solid #303030;border-radius:18px;background:linear-gradient(180deg,#171717,#0d0d0d);box-shadow:inset 0 1px 0 #ffffff08}.case-reel-track{height:100%;display:flex;align-items:center;gap:8px;padding:0 9px;will-change:transform}.reel-item{flex:0 0 92px;height:92px;border:1px solid var(--rarity);border-radius:14px;background:#151515;display:flex;flex-direction:column;align-items:center;justify-content:center}.reel-item strong{font-size:35px}.reel-item small{font-size:9px;color:var(--rarity);font-weight:900;margin-top:4px}.reel-marker{position:absolute;z-index:3;left:50%;top:0;bottom:0;width:3px;background:#ff8a00;box-shadow:0 0 14px #ff8a00;transform:translateX(-50%)}.reel-marker:before{content:'';position:absolute;left:50%;top:-1px;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-top:14px solid #ff8a00}.reel-marker:after{content:'';position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:14px solid #ff8a00}.reel-fast{min-height:46px;border:1px solid #333;border-radius:12px;background:#171717;padding:0 16px;font-weight:900}.reel-fast.active{border-color:var(--orange);color:var(--orange2)}
.auth{width:min(430px,96vw)}.field{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #333;background:#0d0d0d;color:white;margin-bottom:10px}.muted{color:#777}
@media(max-width:900px){.cases{grid-template-columns:repeat(2,1fr)}.profile-layout{grid-template-columns:1fr}.profile-side{display:grid;grid-template-columns:1fr 1fr}.hero{display:block}.stats{grid-template-columns:1fr 1fr}.upgrade-panel{grid-template-columns:1fr}.upgrade-arrow{margin:auto;transform:rotate(90deg)}}@media(max-width:520px){header{padding:0 14px}.top-pill{display:none}.cases{grid-template-columns:1fr}.live-drop{flex-basis:155px}.profile-side{grid-template-columns:1fr}.profile-dashboard{grid-template-columns:1fr!important}.hero h1{font-size:32px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head><body>
<header><div class="logo">Emoji <span>Drops</span></div><div class="top-right"><div class="top-pill">🟢 <span id="onlineCount">128</span> online</div><div class="balance-menu"><div class="top-pill">💰 <span id="balance">1000</span>₽</div><div class="reward-pop"><button id="rewardHeader" class="reward-btn">Получить 250₽</button></div></div><button id="profileBtn" class="profile-top">👤 <span id="nickname">Гость</span></button></div></header>
<main><section class="hero"><div><h1>Открывай. Лови. Забирай.</h1></div></section><section id="cases" class="cases"></section><section class="live-section"><div class="live-title"><span>●</span> LIVE DROPS</div><div id="liveContainer" class="live-container"></div></section></main>
<div id="openModal" class="modal"><div class="panel"><div class="panel-head"><h2 id="openTitle">Кейс</h2><button class="close close-any" data-close="#openModal">✕</button></div><div class="panel-body"><div class="muted" id="amountLabel">Количество открытий</div><div id="amounts" class="amounts"></div><div id="costRow">Стоимость: <span id="openCost" class="open-cost">0₽</span></div><div class="actions" style="margin-top:16px"><button id="openBtn" class="primary">Открыть кейс</button></div><div id="caseItems" class="case-items"></div></div></div></div>
<div id="winModal" class="modal"><div id="winCard" class="win-card"><div id="winEmoji" class="emoji">🏆</div><div id="winRarity" class="rarity">LEGENDARY</div><div id="winPrice" class="price">0₽</div><button class="primary close-any" data-close="#winModal">Забрать</button></div></div>
<div id="profileModal" class="modal"><div class="panel"><div class="panel-head"><h2>Профиль</h2><button class="close close-any" data-close="#profileModal">✕</button></div><div class="panel-body"><div class="profile-layout"><div class="profile-side"><button id="upgradeBtn" class="profile-btn">🚀 Апгрейд</button><button id="statsBtn" class="profile-btn">📊 Статистика</button></div><div class="profile-center"><button id="profileSettingsGear" class="profile-gear" title="Настройки">⚙</button><div class="avatar">👤</div><div id="profileName" class="profile-name">User</div></div><div class="profile-side"><button id="rewardProfile" class="profile-btn reward">Получить 250₽</button><button id="logoutBtn" class="profile-btn">↪ Выйти</button></div></div><div class="profile-dashboard"></div><div class="best-wrap"><div class="section-title">ЛУЧШИЙ ДРОП</div><div id="bestDrop" class="best"><strong>🏆</strong><span>Нет дропа</span></div></div><div class="inventory"><div class="section-title">ИНВЕНТАРЬ</div><div id="inventory" class="inventory-grid"></div></div></div></div></div>
<div id="settingsModal" class="modal"><div class="panel"><div class="panel-head"><h2>Настройки</h2><button class="close" onclick="closeSettings()">✕</button></div><div class="panel-body"><div class="settings-list"><div class="setting"><span>Никнейм</span><input id="nicknameInput" placeholder="Новый ник"></div><button class="primary" onclick="changeNickname()">Сохранить ник</button><div class="setting"><span>Новый пароль</span><input id="newPasswordInput" type="password" placeholder="Минимум 6 символов"></div><button class="secondary" onclick="changePassword()">Сменить пароль</button><button class="secondary" onclick="logout();closeSettings()">Выйти из аккаунта</button><button class="secondary danger" onclick="deleteAccount()">Удалить аккаунт</button></div></div></div></div>
<div id="statsModal" class="modal"><div class="panel"><div class="panel-head"><h2>Статистика</h2><button class="close" onclick="closeStats()">✕</button></div><div class="panel-body"><div class="stats"><div class="stat">Открыто кейсов<b id="statsOpened">0</b></div><div class="stat">Апгрейдов<b id="statsUpgrades">0</b></div><div class="stat">Потрачено<b id="statsSpent">0₽</b></div><div class="stat">Получено<b id="statsReceived">0₽</b></div></div></div></div></div>
<div id="upgradeModal" class="modal"><div class="panel"><div class="panel-head"><h2>Апгрейд</h2><button class="close" onclick="closeUpgrade()">✕</button></div><div class="panel-body"><div id="upgradeInventory" class="upgrade-grid"></div><button id="upgradeDo" class="primary" style="margin-top:18px">Прокачать</button></div></div></div>
<div id="authModal" class="modal"><div class="panel auth"><div class="panel-head"><h2>Вход</h2><button class="close" onclick="closeAuth()">✕</button></div><div class="panel-body"><input id="authEmail" class="field" type="email" placeholder="Почта"><input id="authPassword" class="field" type="password" placeholder="Пароль"><button class="primary" style="width:100%" onclick="submitAuth()">Войти / зарегистрироваться</button></div></div></div>
<script>function getUsers(){try{return JSON.parse(localStorage.getItem('users')||'[]')}catch{return []}}</script><script src="js/data.js"></script><script src="js/app-v2.js"></script>
<script>function changeNickname(){const u=getUser?.(),v=document.getElementById('nicknameInput')?.value.trim();if(!u||!v)return;u.nickname=v;saveUser(u);renderAll?.();document.getElementById('nicknameInput').value='';alert('Ник изменён')}function changePassword(){const u=getUser?.(),v=document.getElementById('newPasswordInput')?.value||'';if(!u)return;if(v.length<6)return alert('Пароль должен быть не короче 6 символов');u.password=v;saveUser(u);document.getElementById('newPasswordInput').value='';alert('Пароль изменён')}function deleteAccount(){const u=getUser?.();if(!u)return;if(!confirm('Удалить аккаунт и весь прогресс?'))return;const a=getUsers().filter(x=>x.email!==u.email);localStorage.setItem('users',JSON.stringify(a));localStorage.removeItem('currentUser');closeSettings?.();renderAll?.()}</script>
</body></html>
