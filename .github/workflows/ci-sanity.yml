name: EmojiDrops CI sanity
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner
        run: |
          node --version
          printf 'CI sanity OK for %s\n' "$GITHUB_SHA"
