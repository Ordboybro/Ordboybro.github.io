name: Load Emoji Drops polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[skip polish]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject stable polish script
        run: |
          cat > js/polish-v3.js <<'EOF'
(()=>{'use strict';const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],users=()=>{try{return JSON.parse(localStorage.getItem('users')||'[]')}catch{return[]}},cur=()=>{const e=localStorage.getItem('currentUser');return users().find(u=>u.email===e)},save=u=>{const a=users(),i=a.findIndex(x=>x.email===u.email);if(i>=0){a[i]=u;localStorage.setItem('users',JSON.stringify(a))}};
function buyable(u){return !!u&&$$('#cases .case-card').some(c=>{const p=+(c.querySelector('.case-price span')?.textContent||'').replace(/[^0-9]/g,'');return p>0&&(+u.balance||0)>=p})}
function css(){if($('#ed-v8'))return;const s=document.createElement('style');s.id='ed-v8';s.textContent=`
.logo{display:flex!important;align-items:center!important;gap:11px!important;white-space:nowrap}.ed-logo{width:38px!important;height:38px!important;object-fit:contain!important;border-radius:10px!important}.top-pill.ed-online{display:flex!important;align-items:center!important;gap:8px!important}.ed-dot{display:inline-block!important;width:8px!important;height:8px!important;border-radius:50%!important;background:#ff3b30!important;box-shadow:0 0 10px #ff3b30!important;animation:edp .95s ease-in-out infinite!important}@keyframes edp{50%{opacity:.45;transform:scale(.78);box-shadow:0 0 5px #ff3b30}}.balance-menu .top-pill{display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;min-width:94px!important;font-weight:900!important;background:linear-gradient(145deg,#18130e,#111)!important}.balance-menu .top-pill:before{content:'₽';display:grid;place-items:center;width:24px;height:24px;border-radius:7px;border:1px solid #5a3a1d;background:#21170d;color:#ffad55;font-size:13px}.ed-balance-icon{display:none!important}.profile-center .avatar{display:none!important}.profile-center{padding-top:24px!important}.profile-center:before{content:'👤';display:grid;place-items:center;width:74px;height:74px;margin:0 auto 10px;border-radius:20px;border:1px solid #4a3a2b;background:radial-gradient(circle at 50% 25%,#2a1b0f,#121212 70%);font-size:38px;box-shadow:0 10px 28px #0008}.cases{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:20px!important}.case-tile{min-width:0!important}.case-tile .case-card{width:100%!important;height:270px!important;min-height:270px!important}.case-tile .case-art{font-size:92px!important;min-height:150px!important;height:auto!important}.case-info{min-height:92px!important}#amountLabel{display:none!important}.amounts{justify-content:center!important;margin:10px 0 8px!important}.amount.active{border-color:var(--orange)!important;background:linear-gradient(145deg,#38200d,#211309)!important;box-shadow:0 0 0 2px #ff7b0033,0 0 16px #ff7b0022!important}.reel-actions{justify-content:center!important;align-items:center!important}.reel-actions button{min-width:155px!important;height:48px!important}.reel-actions #openBtn{min-width:185px!important}.profile-layout{grid-template-columns:1fr 1.4fr 1fr!important;grid-template-areas:'center center center' 'left center2 right'!important;align-items:start!important}.profile-center{grid-area:center!important}.profile-layout>.profile-side:first-child{grid-area:left!important}.profile-layout>.profile-side:last-child{grid-area:right!important}.profile-side{padding-top:0!important}.profile-dashboard{margin-top:10px!important}.best-wrap{margin-top:28px!important}.best{width:min(620px,100%)!important;justify-content:center!important;min-height:100px!important;padding:16px 22px!important;border-radius:22px!important;background:radial-gradient(circle at 50% 0,#ff7b0018,transparent 65%),linear-gradient(145deg,#181818,#101010)!important;box-shadow:0 12px 35px #0008!important}.best strong{font-size:56px!important}.best small{display:block!important;color:#aaa!important;margin-left:8px!important}.inventory{margin-top:30px!important;padding:22px 18px 20px!important;border:1px solid #2d2d2d!important;border-radius:24px!important;background:linear-gradient(180deg,#141414,#0d0d0d)!important;box-shadow:0 15px 45px #0006!important}.inventory .section-title{text-align:center!important;font-size:20px!important;margin:0 0 18px!important}.inventory .section-title:after{content:'';display:block;width:74px;height:2px;margin:8px auto 0;background:linear-gradient(90deg,transparent,#ff7b00,transparent)}.inventory-item{transition:.2s!important}.inventory-item:hover{transform:translateY(-3px)!important}.reward-btn.ready,.profile-btn.reward.ready{box-shadow:0 0 0 1px #ffb35c,0 0 22px #ff7b0030!important}.reward-btn.blocked,.profile-btn.reward.blocked{background:#171717!important;border-color:#333!important;color:#777!important}.ed-reward-hint{font-size:11px;color:#777;margin-top:6px;text-align:center;line-height:1.35}.ed-reward-hint.ready{color:#ff9d3d}.upgrade-wheel{width:164px!important;height:164px!important;padding:8px!important;background:conic-gradient(from -20deg,#ff7b00,#ffb45c,#7c3aed,#ef4444,#ff7b00)!important;box-shadow:0 0 38px #ff7b0050!important}.upgrade-wheel>div{font-size:40px!important;background:radial-gradient(circle,#21160c 0 42%,#111 43% 67%,#241509 68%)!important;border:2px solid #ffb35c!important}.upgrade-wheel-col{position:relative!important}.upgrade-wheel-col:before{content:'';position:absolute;top:calc(50% - 92px);left:50%;transform:translate(-50%,-100%);border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid #ff9d3d;filter:drop-shadow(0 0 7px #ff7b00);z-index:3}.upgrade-wheel-col:after{content:'↗';position:absolute;top:calc(50% - 35px);left:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#15100b;border:2px solid #ff9d3d;color:#ffb35c;font-size:31px;font-weight:900;pointer-events:none}@media(max-width:900px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))!important}.profile-layout{grid-template-columns:1fr!important;grid-template-areas:'center' 'left' 'right'!important}.upgrade-wheel-col:before,.upgrade-wheel-col:after{display:none}}@media(max-width:520px){.cases{grid-template-columns:1fr!important}.case-tile .case-card{height:245px!important;min-height:245px!important}.case-tile .case-art{min-height:125px!important}.profile-dashboard{grid-template-columns:1fr!important}.balance-menu .top-pill{min-width:82px!important}}
`;document.head.appendChild(s)}
function brand(){const l=$('.logo');if(l)l.innerHTML='<img class="ed-logo" src="logo.png" alt="Emoji Drops"><span>Emoji <b style="color:#ff7b00">Drops</b></span>';const o=$('#onlineCount')?.closest('.top-pill');if(o){const n=$('#onlineCount')?.textContent||'128';o.classList.add('ed-online');o.innerHTML='<span class="ed-dot"></span><span id="onlineCount">'+n+'</span> online'}const b=$('#balance');if(b){b.textContent=Math.round(+cur()?.balance||0);b.parentElement.querySelectorAll('.ed-balance-icon').forEach(x=>x.remove())}}
function best(){const u=cur(),e=$('#bestDrop');if(!u||!e)return;const inv=Array.isArray(u.inventory)?u.inventory:[];if(!inv.length){e.innerHTML='<strong>🏆</strong><span>Пока нет лучшего дропа</span>';return}const r={common:1,rare:2,epic:3,mythical:4,legendary:5},v=x=>+x?.value||+x?.price||0,x=inv.slice().sort((a,b)=>(r[b.rarity]||0)-(r[a.rarity]||0)||v(b)-v(a))[0];e.innerHTML=`<strong>${x.emoji||'🎁'}</strong><span>${String(x.rarity||'common').toUpperCase()}</span><small>${money(v(x))}</small>`;e.style.setProperty('--rarity',({common:'#9ca3af',rare:'#3b82f6',epic:'#a855f7',mythical:'#ef4444',legendary:'#ff8a00'}[x.rarity]||'#9ca3af'))}
function money(n){return Math.round(+n||0)+'₽'}
function reward(){const u=cur(),ok=!!u&&!buyable(u);[$('#rewardHeader'),$('#rewardProfile')].forEach(b=>{if(!b)return;b.textContent=ok?'Получить 100₽':'Доступно после нехватки на кейс';b.disabled=!ok;b.classList.toggle('ready',ok);b.classList.toggle('blocked',!ok)});let h=$('#ed-reward-hint');if(!h){h=document.createElement('div');h.id='ed-reward-hint';h.className='ed-reward-hint';const p=$('#rewardProfile')?.parentElement;if(p)p.appendChild(h)}h.textContent=ok?'Можно получать сколько угодно, пока ни один кейс не доступен.':'Сейчас доступен хотя бы один кейс.';h.classList.toggle('ready',ok)}
function claim(e){e?.preventDefault();e?.stopImmediatePropagation();const u=cur();if(!u){window.openAuth?.();return}if(buyable(u))return reward();u.balance=+u.balance||0;u.balance+=100;u.stats=u.stats||{opened:0,upgrades:0,spent:0,received:0};u.stats.received=(+u.stats.received||0)+100;save(u);brand();reward();best()}
function bind(){['rewardHeader','rewardProfile'].forEach(id=>{const b=$('#'+id);if(!b||b.dataset.ed8)return;b.dataset.ed8='1';b.addEventListener('click',claim,true)})}
function removeTopup(){$$('button,div,span,p').forEach(n=>{if((n.textContent||'').trim()==='Пополнить баланс открытием кейса')n.remove()})}
function loop(){brand();bind();reward();best();const a=$('.profile-center .avatar');if(a)a.textContent='';removeTopup()}
function init(){css();loop();setInterval(loop,1000)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          tag='<script src="js/polish-v3.js?v=4"></script>'
          s=re.sub(r'<script src="js/polish-v3\.js\?v=[^\"]+"></script>',tag,s)
          if tag not in s:
              marker='<script>function changeNickname()'
              s=s.replace(marker,tag+'\n'+marker,1) if marker in s else s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/polish-v3.js
          git diff --cached --quiet && exit 0
          git commit -m 'Apply stable Emoji Drops polish [skip polish]'
          git push origin main
