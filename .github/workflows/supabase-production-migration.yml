name: EmojiDrops Supabase production migration

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only preview pending migrations; do not apply them'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: emoji-drops-supabase-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ikodftqyzfeeoophwlvy
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate credentials and migration chain
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN secret'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD secret'; exit 1; }
          test -f supabase/migrations/20260923153500_market_live_canonical.sql
          test -f supabase/migrations/20260924123000_market_concurrency_final.sql
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Preview pending migrations
        run: supabase db push --dry-run
      - name: Apply production migrations
        if: ${{ inputs.dry_run != true }}
        run: supabase db push
      - name: Verify migration history
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase migration list --linked | grep -q '20260924123000' || { echo 'Final Market concurrency migration was not applied'; exit 1; }
