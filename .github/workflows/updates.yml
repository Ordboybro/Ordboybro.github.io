name: EmojiDrops requested updates

on:
  push:
    branches: [refactor/emoji-drops]

permissions:
  contents: write

jobs:
  updates:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/emoji-drops
      - name: Apply requested updates
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          css_path=Path('css/style.css')
          app_path=Path('js/app.js')
          if not css_path.exists() or not app_path.exists():
              print('Refactor split not ready yet; nothing to do.')
              raise SystemExit(0)
          css=css_path.read_text(encoding='utf-8')
          css += r'''

/* === EmojiDrops requested updates === */
.case-price{background:transparent!important;border:2px solid #ff7b00!important;box-shadow:0 0 10px #ff7b0033;padding:6px 10px;border-radius:10px}
.profile-mini-btn{min-width:160px!important;height:50px!important;padding:0 20px!important;font-size:17px!important;border-radius:14px!important}
.best-drop-box{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:15px;padding:22px 26px;background:#161616;border:2px solid #ff7b00;border-radius:24px;box-shadow:0 0 18px #ff7b0033,inset 0 0 20px #ff7b0011}.best-drop-title{color:#ff7b00;font-size:20px;font-weight:800;letter-spacing:.5px}.best-drop-card{width:180px;background:transparent;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:15px}.best-drop-emoji{font-size:60px;width:90px;height:90px;display:flex;align-items:center;justify-content:center;border-radius:20px;border:3px solid #ff7b00;background:#101010}.best-drop-rarity{font-weight:700}
.live-drops-floating{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;z-index:9999!important;padding:14px 20px 16px!important;background:rgba(15,15,15,.96)!important;border-top:2px solid #ff7b00!important;box-shadow:0 -5px 25px #000,0 -2px 15px #ff7b0033!important;backdrop-filter:blur(12px)}
#liveContainer{display:flex!important;flex-direction:row!important;gap:12px!important;width:100%!important;max-height:none!important;overflow-x:auto!important;overflow-y:hidden!important;padding:4px 2px 8px!important;scrollbar-width:thin}#liveContainer::-webkit-scrollbar{height:6px}#liveContainer::-webkit-scrollbar-thumb{background:#ff7b00;border-radius:20px}
.live-drop{min-width:190px!important;height:70px!important;display:flex!important;align-items:center!important;gap:12px!important;padding:10px 14px!important;border-radius:16px!important;background:#171717!important;border:2px solid #555!important;flex-shrink:0!important;transition:.2s!important;animation:liveShow .25s ease!important}.live-drop:hover{transform:translateY(-3px)}.live-drop .live-rarity{font-size:12px;font-weight:800}.live-drop.common{border-color:#808080!important}.live-drop.rare{border-color:#3b82f6!important}.live-drop.epic{border-color:#a855f7!important}.live-drop.mythical{border-color:#ef4444!important}.live-drop.legendary{border-color:#ffd000!important;animation:legendarySparkle 1.2s infinite!important}.live-drop.common .live-rarity{color:#808080}.live-drop.rare .live-rarity{color:#3b82f6}.live-drop.epic .live-rarity{color:#a855f7}.live-drop.mythical .live-rarity{color:#ef4444}.live-drop.legendary .live-rarity{color:#ffd000}@keyframes legendarySparkle{0%,100%{box-shadow:0 0 6px #ffd00033,0 0 12px #ffd00022}50%{box-shadow:0 0 10px #ffd000aa,0 0 22px #ffd00066,0 0 34px #ffd00022}}
'''
          css_path.write_text(css,encoding='utf-8')
          app=app_path.read_text(encoding='utf-8')
          app=app.replace('liveContainer.children.length > 20','liveContainer.children.length > 25').replace('for(let i = 0; i < 20; i++)','for(let i = 0; i < 25; i++)').replace('for (let i = 0; i < 20; i++)','for (let i = 0; i < 25; i++)')
          app=re.sub(r'(state\.currentUser\.inventory\.push\(item\);)(?!\s*considerBestDrop)',r'\1\n    considerBestDrop(item);',app)
          app += r'''

/* === EmojiDrops requested updates === */
function openSettings(){const p=document.getElementById('settingsPage');if(!p)return;p.style.display='flex';document.body.classList.add('modal-open')}
function closeSettings(){const p=document.getElementById('settingsPage');if(!p)return;p.style.display='none';document.body.classList.remove('modal-open')}
function openStats(){const p=document.getElementById('statsPage');if(!p)return;if(typeof updateStatsUI==='function')updateStatsUI();p.style.display='flex';document.body.classList.add('modal-open')}
function closeStats(){const p=document.getElementById('statsPage');if(!p)return;p.style.display='none';document.body.classList.remove('modal-open')}
function considerBestDrop(item){if(!state.currentUser||!item)return;const o={common:1,rare:2,epic:3,mythical:4,legendary:5};const c=state.currentUser.bestDrop;const v=x=>Number(String(x?.price||'0').replace(/[^\d]/g,''));if(!c||o[item.rarity]>o[c.rarity]||(o[item.rarity]===o[c.rarity]&&v(item)>v(c))){state.currentUser.bestDrop={emoji:item.emoji,rarity:item.rarity,price:item.price};if(typeof saveUsers==='function')saveUsers();}}
function updateBestDrop(){if(!state.currentUser)return;const e=document.getElementById('bestDropEmoji'),r=document.getElementById('bestDropRarity');if(!e||!r)return;const b=state.currentUser.bestDrop;if(!b){e.innerText='🏆';r.innerText='Нет дропа';e.style.borderColor='#ff7b00';r.style.color='#ff7b00';return}e.innerText=b.emoji;r.innerText=String(b.rarity).toUpperCase();const c=(rarities[b.rarity]&&rarities[b.rarity].color)||'#ff7b00';e.style.borderColor=c;r.style.color=c}
function createLiveDrop(username,item){const c=document.getElementById('liveContainer');if(!c||!item)return;const d=document.createElement('div');d.className='live-drop '+item.rarity;const color=(rarities[item.rarity]&&rarities[item.rarity].color)||'#ff7b00';d.innerHTML='<div class="live-emoji">'+item.emoji+'</div><div class="live-info"><div class="live-user">'+username+'</div><div class="live-item">'+(item.name||item.emoji)+'</div><div class="live-rarity" style="color:'+color+'">'+String(item.rarity).toUpperCase()+'</div></div>';c.prepend(d);while(c.children.length>25)c.lastElementChild.remove()}
function addLiveDrop(username,item){createLiveDrop(username,item)}
'''
          app_path.write_text(app,encoding='utf-8')
          PY
      - name: Validate
        run: |
          test -s css/style.css && test -s js/app.js
          grep -q 'function openSettings' js/app.js
          grep -q 'function openStats' js/app.js
          grep -q 'function considerBestDrop' js/app.js
          grep -q 'while(c.children.length>25)' js/app.js
      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/style.css js/app.js
          git commit -m '[skip ci] feat: apply requested EmojiDrops updates' || exit 0
          git push origin refactor/emoji-drops
