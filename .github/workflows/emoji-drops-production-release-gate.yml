name: EmojiDrops production release gate

on:
  workflow_run:
    workflows: ["EmojiDrops Supabase production migration"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: emoji-drops-production-release-gate
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Static production migration audit
        run: node tests/emoji-drops-market-migration-audit.js
      - name: Live Supabase anonymous security
        run: node tests/emoji-drops-supabase-anon-security-e2e.js
      - name: Production smoke
        run: node tests/emoji-drops-production-smoke.js
