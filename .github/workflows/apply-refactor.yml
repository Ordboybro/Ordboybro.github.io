name: Apply EmojiDrops refactor

on:
  push:
    branches:
      - refactor/emoji-drops
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[emoji-refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/emoji-drops

      - name: Complete HTML/CSS/JS separation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="css/updates.css">'
          if css not in s:
              s = s.replace('</head>', f'    {css}\n</head>', 1)
          js = '<script src="js/app.js"></script>'
          if js not in s:
              start = s.rfind('<script>')
              end = s.rfind('</script>')
              if start != -1 and end > start:
                  s = s[:start] + js + s[end + len('</script>'):]
          updates = '<script src="js/updates.js"></script>'
          if updates not in s:
              s = s.replace('</body>', f'    {updates}\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply UI update layer
        shell: bash
        run: |
          cat > css/updates.css <<'CSS'
          .case-price{background:transparent!important;border:2px solid #ff7b00;box-shadow:0 0 10px #ff7b0033;border-radius:10px}
          .profile-mini-btn{min-width:160px;min-height:50px;padding:0 20px;font-size:17px;border-radius:14px}
          .best-drop-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 26px;background:#161616;border:2px solid #ff7b00;border-radius:24px;box-shadow:0 0 18px #ff7b0033,inset 0 0 20px #ff7b0011}
          .best-drop-title{color:#ff7b00;font-size:20px;font-weight:800}.best-drop-emoji{width:90px;height:90px;display:flex;align-items:center;justify-content:center;border-radius:20px;border:3px solid #ff7b00;background:#101010;font-size:60px}.best-drop-rarity{font-weight:700}
          .live-drops-floating{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;z-index:9999;padding:14px 20px 16px;background:rgba(15,15,15,.96);border-top:2px solid #ff7b00;box-shadow:0 -5px 25px #000,0 -2px 15px #ff7b0033;backdrop-filter:blur(12px)}
          #liveContainer{display:flex;flex-direction:row;gap:12px;width:100%;max-height:none;overflow-x:auto;overflow-y:hidden;padding:4px 2px 8px}#liveContainer::-webkit-scrollbar{height:6px}#liveContainer::-webkit-scrollbar-thumb{background:#ff7b00;border-radius:20px}
          .live-drop{min-width:190px;height:70px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:#171717;border:2px solid #555;flex-shrink:0;transition:.2s;animation:liveShow .25s ease}.live-drop:hover{transform:translateY(-3px)}
          .live-drop.common{border-color:#808080}.live-drop.rare{border-color:#3b82f6}.live-drop.epic{border-color:#a855f7}.live-drop.mythical{border-color:#ef4444}.live-drop.legendary{border-color:#ffd000;box-shadow:0 0 8px #ffd00055;animation:legendarySparkle 1.2s infinite}.live-drop.common .live-rarity{color:#808080}.live-drop.rare .live-rarity{color:#3b82f6}.live-drop.epic .live-rarity{color:#a855f7}.live-drop.mythical .live-rarity{color:#ef4444}.live-drop.legendary .live-rarity{color:#ffd000}
          @keyframes legendarySparkle{0%,100%{box-shadow:0 0 6px #ffd00033,0 0 12px #ffd00022}50%{box-shadow:0 0 10px #ffd000aa,0 0 22px #ffd00066,0 0 34px #ffd00022}}
          @media(max-width:650px){.live-drops-floating{padding:10px}.live-drop{min-width:155px;height:62px}.profile-mini-btn{min-width:140px;min-height:46px}}
          CSS

          cat > js/updates.js <<'JS'
          (()=>{
            const order={common:1,rare:2,epic:3,mythical:4,legendary:5};
            const colors={common:'#808080',rare:'#3b82f6',epic:'#a855f7',mythical:'#ef4444',legendary:'#ffd000'};
            const num=v=>Number(String(v??'').replace(/[^0-9.]/g,''))||0;
            function bestFromInventory(){
              if(!window.state?.currentUser?.inventory?.length)return null;
              return [...state.currentUser.inventory].sort((a,b)=>(order[b.rarity]-order[a.rarity])||(num(b.price)-num(a.price)))[0];
            }
            function persistBest(){
              if(!window.state?.currentUser)return;
              const candidate=bestFromInventory();
              const saved=state.currentUser.bestDrop;
              if(candidate && (!saved || order[candidate.rarity]>order[saved.rarity] || (order[candidate.rarity]===order[saved.rarity]&&num(candidate.price)>num(saved.price)))){
                state.currentUser.bestDrop={emoji:candidate.emoji,rarity:candidate.rarity,price:candidate.price};
                if(typeof saveUsers==='function')saveUsers();
              }
              const best=state.currentUser.bestDrop;
              const e=document.getElementById('bestDropEmoji'),r=document.getElementById('bestDropRarity');
              if(!e||!r)return;
              if(!best){e.textContent='🏆';r.textContent='Нет дропа';e.style.borderColor='#ff7b00';r.style.color='#ff7b00';return}
              const c=colors[best.rarity]||'#ff7b00';e.textContent=best.emoji;r.textContent=String(best.rarity).toUpperCase();e.style.borderColor=c;r.style.color=c;
            }
            window.openSettings=()=>{const p=document.getElementById('settingsPage');if(p)p.style.display='flex'};
            window.closeSettings=()=>{const p=document.getElementById('settingsPage');if(p)p.style.display='none'};
            window.openStats=()=>{const p=document.getElementById('statsPage');if(!p)return;if(typeof updateStatsUI==='function')updateStatsUI();p.style.display='flex'};
            window.closeStats=()=>{const p=document.getElementById('statsPage');if(p)p.style.display='none'};
            document.addEventListener('DOMContentLoaded',()=>{
              const c=document.getElementById('liveContainer');
              if(c){const remove=c.removeChild.bind(c);c.removeChild=node=>{if(c.children.length>25)return remove(node);};}
              persistBest();setInterval(persistBest,500);
            });
          })();
          JS

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/updates.css js/updates.js
          git diff --cached --quiet && exit 0
          git commit -m '[emoji-refactor] complete split and apply updates'
          git push