name: Apply EmojiDrops refactor

on:
  push:
    branches:
      - refactor/emoji-drops

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[emoji-refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/emoji-drops

      - name: Apply CSS and JS improvements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          
          root = Path('.')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          
          css_link = '<link rel="stylesheet" href="css/updates.css">'
          if css_link not in text:
              text = text.replace('</head>', f'    {css_link}\n</head>', 1)
          
          js_tag = '<script src="js/updates.js"></script>'
          if js_tag not in text:
              text = text.replace('</body>', f'    {js_tag}\n</body>', 1)
          
          index.write_text(text, encoding='utf-8')
          
          css = r'''/* EmojiDrops UI update layer */
          .case-price{
              background:transparent !important;
              border:2px solid #ff7b00;
              box-shadow:0 0 10px #ff7b0033;
              border-radius:10px;
          }
          .profile-mini-btn{
              min-width:160px;
              min-height:50px;
              padding:0 20px;
              font-size:17px;
              border-radius:14px;
          }
          .best-drop-box{
              display:flex;
              flex-direction:column;
              align-items:center;
              gap:14px;
              padding:22px 26px;
              background:#161616;
              border:2px solid #ff7b00;
              border-radius:24px;
              box-shadow:0 0 18px #ff7b0033, inset 0 0 20px #ff7b0011;
          }
          .best-drop-title{color:#ff7b00;font-size:20px;font-weight:800}
          .best-drop-emoji{
              width:90px;height:90px;display:flex;align-items:center;justify-content:center;
              border-radius:20px;border:3px solid #ff7b00;background:#101010;font-size:60px;
          }
          .best-drop-rarity{font-weight:700}
          .live-drops-floating{
              position:fixed !important;left:0 !important;right:0 !important;bottom:0 !important;
              width:100% !important;z-index:9999;padding:14px 20px 16px;
              background:rgba(15,15,15,.96);border-top:2px solid #ff7b00;
              box-shadow:0 -5px 25px #000,0 -2px 15px #ff7b0033;backdrop-filter:blur(12px);
          }
          #liveContainer{display:flex;flex-direction:row;gap:12px;width:100%;max-height:none;overflow-x:auto;overflow-y:hidden;padding:4px 2px 8px}
          #liveContainer::-webkit-scrollbar{height:6px}
          #liveContainer::-webkit-scrollbar-thumb{background:#ff7b00;border-radius:20px}
          .live-drop{min-width:190px;height:70px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:#171717;border:2px solid #555;flex-shrink:0;transition:.2s;animation:liveShow .25s ease}
          .live-drop:hover{transform:translateY(-3px)}
          .live-drop.common{border-color:#808080}.live-drop.rare{border-color:#3b82f6}.live-drop.epic{border-color:#a855f7}.live-drop.mythical{border-color:#ef4444}.live-drop.legendary{border-color:#ffd000;box-shadow:0 0 8px #ffd00055;animation:legendarySparkle 1.2s infinite}
          .live-drop.common .live-rarity{color:#808080}.live-drop.rare .live-rarity{color:#3b82f6}.live-drop.epic .live-rarity{color:#a855f7}.live-drop.mythical .live-rarity{color:#ef4444}.live-drop.legendary .live-rarity{color:#ffd000}
          @keyframes legendarySparkle{0%,100%{box-shadow:0 0 6px #ffd00033,0 0 12px #ffd00022}50%{box-shadow:0 0 10px #ffd000aa,0 0 22px #ffd00066,0 0 34px #ffd00022}}
          @media(max-width:650px){.live-drops-floating{padding:10px}.live-drop{min-width:155px;height:62px}.profile-mini-btn{min-width:140px;min-height:46px}}
          '''
          (root/'css/updates.css').write_text(css, encoding='utf-8')
          
          js = r'''/* EmojiDrops update layer */
          (() => {
              const rarityOrder = {common:1, rare:2, epic:3, mythical:4, legendary:5};
              const rarityColors = {
                  common:'#808080', rare:'#3b82f6', epic:'#a855f7', mythical:'#ef4444', legendary:'#ffd000'
              };
              
              function priceNumber(value){
                  return Number(String(value ?? '').replace(/[^0-9.]/g,'')) || 0;
              }
              
              window.considerBestDrop = function(item){
                  if(!window.state?.currentUser || !item) return;
                  const current = state.currentUser.bestDrop;
                  const better = !current ||
                      (rarityOrder[item.rarity] || 0) > (rarityOrder[current.rarity] || 0) ||
                      ((rarityOrder[item.rarity] || 0) === (rarityOrder[current.rarity] || 0) && priceNumber(item.price) > priceNumber(current.price));
                  if(better){
                      state.currentUser.bestDrop = {emoji:item.emoji, rarity:item.rarity, price:item.price};
                      if(typeof saveUsers === 'function') saveUsers();
                      if(typeof updateBestDrop === 'function') updateBestDrop();
                  }
              };
              
              window.updateBestDrop = function(){
                  if(!window.state?.currentUser) return;
                  const best = state.currentUser.bestDrop;
                  const emoji = document.getElementById('bestDropEmoji');
                  const rarity = document.getElementById('bestDropRarity');
                  if(!emoji || !rarity) return;
                  if(!best){
                      emoji.textContent = '🏆'; rarity.textContent = 'Нет дропа';
                      emoji.style.borderColor = '#ff7b00'; rarity.style.color = '#ff7b00'; return;
                  }
                  const color = rarityColors[best.rarity] || '#ff7b00';
                  emoji.textContent = best.emoji;
                  rarity.textContent = String(best.rarity).toUpperCase();
                  emoji.style.borderColor = color;
                  rarity.style.color = color;
              };
              
              window.openSettings = function(){
                  const page = document.getElementById('settingsPage');
                  if(page) page.style.display = 'flex';
              };
              window.closeSettings = function(){
                  const page = document.getElementById('settingsPage');
                  if(page) page.style.display = 'none';
              };
              window.openStats = function(){
                  const page = document.getElementById('statsPage');
                  if(!page) return;
                  if(typeof updateStatsUI === 'function') updateStatsUI();
                  page.style.display = 'flex';
              };
              window.closeStats = function(){
                  const page = document.getElementById('statsPage');
                  if(page) page.style.display = 'none';
              };
              
              const originalAddLiveDrop = window.addLiveDrop;
              window.addLiveDrop = function(username, item){
                  if(typeof window.createLiveDrop === 'function') return window.createLiveDrop(username, item);
                  if(typeof originalAddLiveDrop === 'function') return originalAddLiveDrop(username, item);
              };
              
              function hookBestDrop(){
                  if(typeof window.updateBestDrop === 'function') window.updateBestDrop();
              }
              document.addEventListener('DOMContentLoaded', hookBestDrop);
              window.addEventListener('load', hookBestDrop);
          })();
          '''
          (root/'js/updates.js').write_text(js, encoding='utf-8')
          PY

      - name: Normalize Live Drops limit and best-drop persistence hooks
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('children.length > 20', 'children.length > 25')
          s = s.replace('i < 20', 'i < 25')
          marker = 'state.currentUser.inventory.push(item);'
          if marker in s and 'considerBestDrop(item);' not in s:
              s = s.replace(marker, marker + '\n\n    if(typeof considerBestDrop === "function") considerBestDrop(item);', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/updates.css js/updates.js js/app.js
          git diff --cached --quiet && exit 0
          git commit -m '[emoji-refactor] apply UI updates and persistence fixes'
          git push
