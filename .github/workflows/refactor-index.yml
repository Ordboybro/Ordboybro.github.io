name: Complete EmojiDrops JS migration

on:
  push:
    branches: [refactor/emoji-drops]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/emoji-drops
          fetch-depth: 0

      - name: Migrate index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if 'src="js/data.js"' in html and 'src="js/app.js"' in html and 'src="js/updates.js"' in html:
              print("External JS already connected; nothing to migrate.")
              raise SystemExit(0)

          script_re = re.compile(r"<script(?![^>]*\bsrc\s*=)[^>]*>.*?</script>", re.IGNORECASE | re.DOTALL)

          def keep_script(match):
              body = match.group(0)
              lower = body.lower()
              game_markers = (
                  "const state =", "let state =", "var state =", "function opencase",
                  "function createcase", "function randomlivedrop", "function addlivedrop",
                  "function sellwin", "function updatebestdrop", "const rarities =",
                  "const caseprices =", "const cases ="
              )
              return "" if any(marker in lower for marker in game_markers) else body

          migrated = script_re.sub(keep_script, html)

          tags = (
              '\n<script src="js/data.js"></script>'
              '\n<script src="js/app.js"></script>'
              '\n<script src="js/updates.js"></script>\n'
          )

          if "</body>" in migrated:
              migrated = migrated.replace("</body>", tags + "</body>", 1)
          else:
              migrated += tags

          path.write_text(migrated, encoding="utf-8")
          print("index.html migrated")

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "refactor: finish index javascript migration"
          git push origin HEAD:refactor/emoji-drops
