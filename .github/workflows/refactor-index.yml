name: Finish Emoji Drops JS refactor

on:
  push:
    branches:
      - refactor/emoji-drops

permissions:
  contents: write

jobs:
  refactor-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move inline JavaScript to modules
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          # Keep the EmailJS bootstrap script. Remove only the large application script
          # that starts with updateOnline() and contains the legacy monolithic app.
          pattern = r'\n<script>\s*function updateOnline\(\).*?</script>\s*'
          html, removed = re.subn(pattern, "\n", html, count=1, flags=re.S)

          if removed != 1:
              raise SystemExit("Could not find the monolithic application script")

          # The update stylesheet is intentionally empty during this refactor.
          html = re.sub(r'\s*<link rel="stylesheet" href="css/updates\.css">', "", html, count=1)

          scripts = '''\n<script src="js/data.js"></script>\n<script src="js/app.js"></script>\n'''
          if 'src="js/app.js"' not in html:
              html = html.replace("</body>", scripts + "</body>", 1)

          path.write_text(html, encoding="utf-8")

      - name: Validate HTML and JavaScript presence
        shell: python
        run: |
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert 'src="js/data.js"' in html
          assert 'src="js/app.js"' in html
          assert 'function updateOnline()' not in html
          assert Path("js/data.js").exists()
          assert Path("js/app.js").exists()
          print("index.html JS extraction validation passed")

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor: finish index javascript extraction [skip ci]"
            git push
          fi
