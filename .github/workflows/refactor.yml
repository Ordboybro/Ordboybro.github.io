name: EmojiDrops refactor

on:
  push:
    branches:
      - refactor/emoji-drops

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/emoji-drops

      - name: Split HTML, CSS and JavaScript
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          style_match = re.search(r'<style>(.*?)</style>', html, re.S | re.I)
          if not style_match:
              raise SystemExit('style block not found')
          css = style_match.group(1).strip() + '\n'

          script_matches = list(re.finditer(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', html, re.S | re.I))
          main = None
          tail = []
          for m in script_matches:
              body = m.group(1)
              if 'const rarities =' in body and 'const cases =' in body:
                  main = m
              elif 'twofaToggle' in body or 'Emoji Drops loaded' in body:
                  tail.append(body.strip())
          if main is None:
              raise SystemExit('main inline script not found')

          js = main.group(1).strip() + '\n\n' + '\n\n'.join(tail) + '\n'

          state_match = re.search(r'(?=const state = \{)', js)
          data_match = re.search(r'const state = \{', js)
          if not data_match:
              raise SystemExit('state declaration not found')
          data_js = js[:data_match.start()].strip() + '\n'
          app_js = js[data_match.start():]

          Path('css').mkdir(exist_ok=True)
          Path('js').mkdir(exist_ok=True)
          Path('css/style.css').write_text(css, encoding='utf-8')
          Path('js/data.js').write_text(data_js, encoding='utf-8')
          Path('js/app.js').write_text(app_js, encoding='utf-8')

          html = html[:style_match.start()] + '<link rel="stylesheet" href="css/style.css">' + html[style_match.end():]
          # Remove the main inline script and the small trailing inline scripts.
          for m in reversed(script_matches):
              body = m.group(1)
              if m is main or 'twofaToggle' in body or 'Emoji Drops loaded' in body:
                  html = html[:m.start()] + html[m.end():]

          html = html.replace('</body>', '<script src="js/data.js"></script>\n<script src="js/app.js"></script>\n\n</body>')
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/style.css js/data.js js/app.js
          git commit -m '[skip ci] refactor: split EmojiDrops into HTML CSS and JS' || exit 0
          git push origin refactor/emoji-drops
