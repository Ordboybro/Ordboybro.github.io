name: EmojiDrops static QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find js -type f -name '*.js' -print0 | sort -z)

  html-assets-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local script/style references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          refs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          refs += re.findall(r'<link[^>]+href=["\']([^"\']+\.css)["\']',html,re.I)
          missing=[]
          for ref in refs:
              clean=ref.split('?',1)[0].split('#',1)[0]
              if clean.startswith(('http://','https://','//','data:')): continue
              if not Path(clean.lstrip('/')).exists(): missing.append(ref)
          if missing: raise SystemExit('Missing local assets: '+', '.join(missing))
          print('Assets OK:',len(refs))
          PY
      - name: Enforce one runtime entry point
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          runtime=[x.split('?',1)[0] for x in scripts if 'app-v2.js' in x]
          if runtime!=['js/app-v2.js']: raise SystemExit(f'Unexpected runtime: {runtime}')
          app=Path('js/app-v2.js').read_text(encoding='utf-8')
          if 'emoji-drops-core.js' not in app: raise SystemExit('Core runtime missing')
          forbidden=['product-quality.js','visual-restoration.js','final-polish.js','case-expansion.js','system-overhaul']
          bad=[x for x in forbidden if x in html or x in app]
          if bad: raise SystemExit('Legacy runtime referenced: '+', '.join(bad))
          print('Runtime architecture OK')
          PY
      - name: Validate rarity odds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          js=Path('js/emoji-drops-core.js').read_text(encoding='utf-8')
          m=re.search(r'const R=\{([^}]+)\}',js)
          nums=[int(x) for x in re.findall(r'w:(\d+)',m.group(1))] if m else []
          if len(nums)!=5 or sum(nums)!=100: raise SystemExit(f'Invalid odds: {nums}')
          print('Odds OK:',nums)
          PY
      - name: Validate canonical dataset
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          let code=fs.readFileSync('js/data.js','utf8');
          const ctx={window:{},document:{getElementById:()=>null},localStorage:{getItem:()=>null,setItem:()=>{}},console};
          vm.createContext(ctx);vm.runInContext(code,ctx,{timeout:2000});
          const cases=ctx.cases, prices=ctx.casePrices;
          if(!cases||!prices) throw new Error('Dataset missing');
          const rar=['common','rare','epic','mythical','legendary'];
          for(const [key,list] of Object.entries(cases)){
            if(!Array.isArray(list)||!list.length) throw new Error(key+': empty');
            if(!(Number(prices[key])>0)) throw new Error(key+': invalid price');
            for(const r of rar) if(!list.some(x=>x&&x.rarity===r)) throw new Error(key+': missing '+r);
          }
          console.log('Dataset OK:',Object.keys(cases).length,'cases');
          NODE
