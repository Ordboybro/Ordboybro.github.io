name: EmojiDrops static QA
# Release contract synchronized with runtime v336 / Live Drops v20.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emoji-drops-static-qa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          find js tests -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          node --check js/data.js
      - name: Assets and boot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(); refs=re.findall(r"<script[^>]+src=['\"]([^'\"]+)",h,re.I)
          missing=[x for x in refs if not x.split('?',1)[0].startswith(('http://','https://','//','data:')) and not Path(x.split('?',1)[0].lstrip('/')).exists()]
          if missing: raise SystemExit('Missing assets: '+str(missing))
          a=Path('js/app-v2.js').read_text(); order=['emoji-drops-schema-migration.js','emoji-drops-hardening.js','emoji-drops-core.js','emoji-drops-transaction-layer.js','emoji-drops-runtime-guards.js','emoji-drops-final-hardening.js','emoji-drops-release-polish.js','emoji-drops-product-layer.js','emoji-drops-navigation-final.js','emoji-drops-quality-final.js','emoji-drops-p4-final.js','emoji-drops-case-showcase-exact.js','emoji-drops-reference-v23-studio.js','emoji-drops-market-v26.js','emoji-drops-final-product-polish.js','emoji-drops-upgrade-final.js','emoji-drops-final-ux.js','emoji-drops-live-final.js','emoji-drops-p5-final-audit.js']
          m=re.search(r"const files=\[(.*?)\];",a,re.S)
          if not m: raise SystemExit('Runtime files manifest missing')
          runtime_files=[x.split('?',1)[0].lstrip('/') for x in re.findall(r"['\"]([^'\"]+\.js)(?:\?[^'\"]*)?['\"]",m.group(1))]
          missing_runtime=[x for x in runtime_files if not Path(x).exists()]
          if missing_runtime: raise SystemExit('Missing runtime modules: '+str(missing_runtime))
          runtime=[Path(x).name for x in re.findall(r"['\"]([^'\"]+\.js)(?:\?[^'\"]*)?['\"]",m.group(1))]
          selected=[x for x in runtime if x in order]
          if selected!=order: raise SystemExit('Runtime order failed: '+str(selected))
          for v in ['schema-1','core-25','supabase-auth-8','hardening-9','txn-13','guards-8','final-11','release-1','product-6','quality-final-1','p4-3','case-showcase-exact-40','studio-37','market-v26-21','final-product-polish-8','upgrade-final-29','final-ux-15','live-final-20','p5-final-audit-2']:
              if v not in a: raise SystemExit('Cache version missing: '+v)
          product=Path('js/emoji-drops-product-layer.js').read_text()
          app=Path('js/app-v2.js').read_text()
          for marker in ['ed-product-empty','setTimeout(run,90)','input.autocomplete=\'off\'']:
            if marker not in product: raise SystemExit('Product search contract missing: '+marker)
          if 'emojiDropsFavoritesV2' not in app: raise SystemExit('Canonical favorites V2 contract missing')
          if 'function stage2FavoriteSort' in app: raise SystemExit('Obsolete duplicate Favorites owner still loaded')
          market=Path('js/emoji-drops-market-v26.js').read_text()
          if 'version:32' not in market or 'destroy' not in market: raise SystemExit('Market lifecycle owner contract missing')
          if '((streak-1)%7)+1' not in Path('supabase/schema.sql').read_text(): raise SystemExit('Daily reward cycle contract missing')
          if 'streak?((streak-1)%7)+1:0' not in Path('js/emoji-drops-core.js').read_text(): raise SystemExit('Daily UI cycle contract missing')
          txlayer=Path('js/emoji-drops-transaction-layer.js').read_text()
          for dead_marker in ['emojiDropsLocalMarketV1','function install(){return;','data-cancel-market','market-cancel']:
              if dead_marker in market or dead_marker in txlayer: raise SystemExit('Obsolete transaction/market compatibility marker still loaded: '+dead_marker)
          for marker in ['version:11','PHASE','run(label,executor,apply,options)','remoteOperation=options?.remote!==false','leaseOwnershipVerified:true','faultAware:true']:
              if marker not in txlayer: raise SystemExit('Transaction lifecycle contract missing: '+marker)
          for dead in ['js/emoji-drops-case-showcase.js','js/emoji-drops-case-showcase-final.js','js/emoji-drops-case-showcase-override.js','js/emoji-drops-case-authority.js']:
              if Path(dead).exists(): raise SystemExit('Legacy case file still present: '+dead)
          for dead in ['emoji-drops-ui-polish-v2.js','emoji-drops-main-reference-v2.js','emoji-drops-layout-v3.js','emoji-drops-reference-v5.js','emoji-drops-reference-interaction-fix.js','emoji-drops-reference-v8-luxe.js','emoji-drops-reference-v9-hitfix.js','emoji-drops-reference-v10-stability.js','emoji-drops-reference-v11-modal-reset.js','emoji-drops-reference-v13-fixed-action.js','emoji-drops-reference-v15-case-precedence.js','emoji-drops-reference-v18-modal-cleanup.js','emoji-drops-reference-v20-studio.js']:
              if dead in a: raise SystemExit('Legacy visual layer still loaded: '+dead)
          ref=Path('js/emoji-drops-reference-v23-studio.js').read_text()
          for dead in ['js/emoji-drops-final-ux-v4.js','js/emoji-drops-upgrade-interaction-guard.js']:
            if Path(dead).exists(): raise SystemExit('Obsolete compatibility shim still present: '+dead)
          hard=Path('js/emoji-drops-final-hardening.js').read_text()
          if 'const VERSION=11' not in hard or '#edExact' in hard: raise SystemExit('Exact modal is still owned by generic hardening')
          for marker in ['v24','ed-profile-hub','ed-studio-page','Live Drops','min-height:48px','min-width:50px']:
              if marker not in ref: raise SystemExit('v23 visual contract missing: '+marker)
          for n in [1,2,3]:
              if not Path(f'assets/emoji-drops/sprite-{n}.b64').exists(): raise SystemExit(f'Missing reference sprite chunk: {n}')
          for n in ['smile','nature','food']:
              if not Path(f'assets/emoji-drops/live-{n}.b64').exists(): raise SystemExit(f'Missing Live Drops artwork: {n}')
          if not Path('assets/emoji-drops/smile.b64').exists(): raise SystemExit('Missing exact Smile modal artwork')
          for path,marker in [('js/emoji-drops-reference-v23-studio.js','observerDebounceMs:90')]:
              if marker not in Path(path).read_text(): raise SystemExit('Observer budget contract missing: '+path)
          if 'const version=336' not in app: raise SystemExit('Runtime version/cache bump missing')
          config=Path('js/supabase-config.js').read_text()
          auth=Path('js/supabase-auth.js').read_text()
          if 'publishableKey' not in config or 'publishableKey' not in auth: raise SystemExit('Supabase publishable-key naming contract missing')
          if 'anonKey' in config or 'anonKey' in auth: raise SystemExit('Legacy anonKey naming remains in production client bridge')
          if 'js/app-v2.js?v=runtime-336' not in Path('index.html').read_text(): raise SystemExit('Production runtime cache contract missing')
          upgrade=Path('js/emoji-drops-upgrade-final.js').read_text()
          rpc_i=upgrade.find('const result=await tx.run(')
          wheel_i=upgrade.find('wheel.style.transform')
          if rpc_i < 0 or wheel_i < 0 or wheel_i < rpc_i: raise SystemExit('Upgrade animation starts before authoritative RPC result')
          if 'prefers-reduced-motion:reduce' not in app or '.edfp-wheel' not in app or '.edx-reel' not in app: raise SystemExit('Reduced-motion coverage missing for cinematic surfaces')
          live=Path('js/emoji-drops-live-final.js').read_text()
          if 'version:20' not in live: raise SystemExit('Live Drops owner version mismatch')
          if 'live-final-20' not in app: raise SystemExit('Live Drops cache contract missing')
          if 'SUBSCRIBED' not in live or 'FALLBACK' not in live or '● LIVE' not in live: raise SystemExit('Live Drops Realtime status contract missing')
          if '--ed-bg:#070707' not in app or '--ed-surface:#101010' not in app or 'prefers-reduced-motion:reduce' not in app: raise SystemExit('Design-system/reduced-motion contract missing')
          if 'profile_snapshot' not in Path('supabase/schema.sql').read_text() or 'profile_snapshot' not in Path('js/emoji-drops-core.js').read_text(): raise SystemExit('Server profile sync contract missing')
          if 'authoritative owner' not in app or 'case-showcase-exact' not in app or 'transaction-layer' not in app: raise SystemExit('Runtime ownership contract missing')
          exact=Path('js/emoji-drops-case-showcase-exact.js').read_text()
          for marker in ['version:15','aria-modal="true"','openCase','translateX','role="dialog"','₽','Case items','edx-result-actions','edx-claim','edx-sell','sell_item_server','case_fairness_commit','verifyFairnessReceipt']:
              if marker not in exact: raise SystemExit('Exact showcase contract missing: '+marker)
          if "onpointerup=closeEvent" in exact or "ontouchend=closeEvent" in exact or "closeFromTouch" in exact: raise SystemExit('Duplicate/undefined modal touch-close owner remains')
          if "window.addEventListener('click',e=>{const closeButton" in exact: raise SystemExit('Global case modal click owner still duplicates native button owner')
          if "remote:false" not in exact: raise SystemExit('Local case transaction must explicitly disable remote recovery')
          if 'orientation:landscape' not in exact or 'max-height:500px' not in exact or '#edExactBox .edx-open' not in exact or 'position:sticky' not in exact: raise SystemExit('Exact landscape/CTA contract missing after ownership merge')
          PY
          node tests/emoji-drops-static-audit-v3.js
      - name: Final release readiness gate
        run: node tests/emoji-drops-release-readiness.js
      - name: Code quality and engineering audit
        run: node tests/emoji-drops-engineering-audit.js
      - name: Economy
        run: node tests/emoji-drops-economy-self-test.js
      - name: Economy final gate
        run: node tests/emoji-drops-economy-final-gate.js
      - name: Weighted economy report
        run: node tests/emoji-drops-economy-report.js
      - name: Economy source-of-truth audit
        run: node tests/emoji-drops-economy-source-audit.js
      - name: Runtime hardening
        run: node tests/emoji-drops-runtime-hardening-self-test.js
      - name: Transaction layer
        run: node tests/emoji-drops-transaction-self-test.js
      - name: Reliability recovery and storage faults
        run: node tests/emoji-drops-reliability-self-test.js
      - name: Final quality invariants
        run: node tests/emoji-drops-final-quality-self-test.js
      - name: Release economy currency UX
        run: node tests/emoji-drops-release-polish-self-test.js
      - name: Product quality
        run: node tests/emoji-drops-product-self-test.js
      - name: Product-plus retirement contract
        run: node tests/emoji-drops-product-plus-self-test.js
      - name: Action-resilience retirement contract
        run: node tests/emoji-drops-action-resilience-self-test.js
      - name: P3/P4 contracts
        run: node tests/emoji-drops-p3-p4-self-test.js
      - name: Supabase schema security and atomicity audit
        run: node tests/emoji-drops-supabase-schema-audit.js
      - name: Committed fairness contract
        run: node tests/emoji-drops-fairness-contract.js
      - name: Auth/local/cloud boundary
        run: node tests/emoji-drops-auth-boundary-self-test.js
      - name: Exact server/frontend catalog consistency
        run: node tests/emoji-drops-catalog-consistency.js
      - name: Canonical economy consistency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          data=Path('js/data.js').read_text()
          schema=Path('supabase/schema.sql').read_text()
          prices={'smile':100,'moves':80,'nature':60,'food':40,'animals':20,'transport':20,'sport':250,'games':500}
          for k,p in prices.items():
            if not re.search(r'(?m)^\s*["\']?'+re.escape(k)+r'["\']?\s*:\s*\[' ,data): raise SystemExit('Missing frontend case: '+k)
            if not re.search(r'when [\'\"]'+re.escape(k)+r'[\'\"] then '+str(p)+r'\b',schema,re.I): raise SystemExit('Case price drift: '+k)
          rows=re.findall(r"\('([^']+)',\d+,'([^']*)','(common|rare|epic|mythical|legendary)',([0-9.]+)\)",schema)
          if len(rows)<300: raise SystemExit('Server catalog unexpectedly small: '+str(len(rows)))
          for k in prices:
            if sum(1 for r in rows if r[0]==k)<10: raise SystemExit('Server catalog incomplete: '+k)
          if len(re.findall(r'create or replace function public\.open_case_server\(',schema))!=1: raise SystemExit('Multiple open_case_server definitions')
          if len(re.findall(r'create or replace function public\.upgrade_server\(',schema))!=1: raise SystemExit('Multiple upgrade_server definitions')
          for marker in ['for update','SELF_PURCHASE_FORBIDDEN','claim_daily_server','INVALID_TARGET','case_items_lookup_idx','alter publication supabase_realtime add table public.live_drops','secure_uniform_roll','roll numeric:=public.secure_uniform_roll()']:
            if marker not in schema: raise SystemExit('Economy/realtime contract missing: '+marker)
          print('Canonical economy consistency OK')
          PY
      - name: Security/privacy audit
        run: node tests/emoji-drops-security-audit.js
      - name: Market privacy regression
        run: node tests/emoji-drops-market-privacy-self-test.js
      - name: Market race contract
        run: node tests/emoji-drops-market-race-contract.js
      - name: 10/20/50 concurrency invariant model
        run: node tests/emoji-drops-concurrency-model.js
      - name: Live Drops realtime lifecycle contract
        run: node tests/emoji-drops-live-realtime-contract.js
      - name: Market production migration audit
        run: node tests/emoji-drops-market-migration-audit.js
      - name: Final hardening contract
        run: node -e "const fs=require('fs');const s=fs.readFileSync('js/emoji-drops-final-hardening.js','utf8');for(const x of ['aria-live','aria-modal','Escape','focus-trap','PerformanceObserver','storageHealth','stateHealth'])if(!s.includes(x))throw Error(x);console.log('Final hardening contract OK')"
      - name: Browser dependencies
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 axe-core@4.13.0
          npx playwright install --with-deps chromium webkit
      - name: Focused case diagnostic
        run: node tests/emoji-drops-case-diagnostic.js
      - name: Browser E2E matrix
        run: node tests/emoji-drops-browser-e2e.js
      - name: Upgrade E2E
        run: node tests/emoji-drops-upgrade-e2e-v2.js
      - name: Accessibility E2E
        run: node tests/emoji-drops-accessibility-e2e.js
      - name: Performance lifecycle diagnostic
        timeout-minutes: 3
        run: node tests/emoji-drops-performance-diagnose.js
      - name: Performance budget E2E
        run: node tests/emoji-drops-performance-budget-e2e.js
      - name: Mobile responsive and touch E2E
        run: node tests/emoji-drops-mobile-e2e.js
      - name: 100-cycle long-session lifecycle E2E
        timeout-minutes: 4
        run: node tests/emoji-drops-long-session-e2e.js
      - name: Recovery and multi-tab E2E
        run: node tests/emoji-drops-recovery-e2e.js
      - name: Live Supabase anonymous security matrix
        id: live_supabase_security
        continue-on-error: true
        run: node tests/emoji-drops-supabase-anon-security-e2e.js
      - name: Security audit
        if: always()
        run: node tests/emoji-drops-security-audit.js
      - name: P2-P4 architecture audit
        if: always()
        run: node tests/emoji-drops-architecture-audit.js
      - name: P2-P4 visual regression smoke
        if: always()
        run: node tests/emoji-drops-visual-regression-smoke.js
      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emoji-drops-visual-qa-${{ github.run_id }}
          path: /tmp/emoji-drops-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Production smoke
        if: always()
        run: node tests/emoji-drops-production-smoke.js
      - name: Final P2/P3 contract smoke
        if: always()
        run: node tests/emoji-drops-p5-p3-self-test.js
      - name: Release evidence manifest
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "sha": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "job": os.environ.get("GITHUB_JOB"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "required_gate": "all workflow steps must pass; this manifest is evidence for the exact tested SHA",
          }
          with open('/tmp/emoji-drops-release-manifest.json','w',encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2)
          PY
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emoji-drops-release-evidence-${{ github.run_id }}
          path: /tmp/emoji-drops-release-manifest.json
          retention-days: 14
      - name: Final release gate
        if: always()
        run: |
          if [ "${{ success() }}" != "true" ]; then
            echo "Release gate FAILED: one or more required QA steps did not pass."
            exit 1
          fi
          if [ "${{ steps.live_supabase_security.outcome }}" = "failure" ]; then
            echo "Release gate FAILED: live Supabase security matrix failed (production migration/security blocker)."
            exit 1
          fi
          echo "Release gate PASSED for SHA ${GITHUB_SHA}"
