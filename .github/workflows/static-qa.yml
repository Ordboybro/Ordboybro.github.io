name: EmojiDrops static QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          set -euo pipefail
          find js tests -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          node --check data.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          h=Path('index.html').read_text()
          scripts=re.findall(r"<script(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)</script>",h,re.I)
          for i,s in enumerate(scripts,1):
              if s.strip():
                  p=Path(f'/tmp/inline-{i}.js'); p.write_text(s); subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Assets and boot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text()
          refs=re.findall(r"<script[^>]+src=['\"]([^'\"]+)",h,re.I)
          missing=[x for x in refs if not x.split('?',1)[0].startswith(('http://','https://','//','data:')) and not Path(x.split('?',1)[0].lstrip('/')).exists()]
          if missing: raise SystemExit('Missing assets: '+str(missing))
          a=Path('js/app-v2.js').read_text(); boot=Path('data.js').read_text()
          order=['emoji-drops-hardening.js','emoji-drops-core.js','emoji-drops-runtime-guards.js','emoji-drops-ui-polish.js']
          if not all(a.index(order[i])<a.index(order[i+1]) for i in range(len(order)-1)): raise SystemExit('Runtime order failed')
          if 'hardening-9' not in a or 'guards-8' not in a or 'ui-3' not in a: raise SystemExit('Cache versions stale')
          if 'src="js/data.js' not in boot or 'src="data.js' in boot: raise SystemExit('Bad dataset bootstrap')
          if not Path('js/emoji-drops-ui-polish.js').exists(): raise SystemExit('UI polish asset missing')
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),w=[];
          const document={write:s=>w.push(s),getElementById:()=>null,head:{appendChild:()=>{}},addEventListener:()=>{},querySelector:()=>null};
          const window={cases:null,casePrices:null,rarities:null};
          const c={window,document,localStorage:{getItem:()=>null,setItem:()=>{}},console,getUsers:()=>[],setInterval:()=>0,clearInterval:()=>{}};
          vm.createContext(c); vm.runInContext(fs.readFileSync('data.js','utf8'),c); if(w.length!==1||!w[0].includes('js/data.js'))throw Error('root bootstrap'); vm.runInContext(fs.readFileSync('js/data.js','utf8'),c); vm.runInContext(fs.readFileSync('js/app-v2.js','utf8'),c); if(Object.keys(window.cases||{}).length!==8||Object.keys(window.casePrices||{}).length!==8)throw Error('dataset bridge'); if(w.length!==5)throw Error('runtime writes: '+w.join(' | ')); if(!w[4].includes('emoji-drops-ui-polish.js'))throw Error('UI polish was not loaded'); console.log('Boot OK: dataset -> bridge -> hardening -> core -> guards -> UI');
          NODE
      - name: Economy
        run: node tests/emoji-drops-economy-self-test.js
      - name: Runtime hardening
        run: node tests/emoji-drops-runtime-hardening-self-test.js
      - name: Guard contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),storage=new Map(),ctx={window:{cases:{},casePrices:{smile:100,moves:80,nature:60,food:40,animals:20,transport:10,sport:250,games:500},addEventListener:()=>{}},document:{write:()=>{},getElementById:()=>null,addEventListener:()=>{},querySelector:()=>null},localStorage:{getItem:k=>storage.get(k)??null,setItem:(k,v)=>storage.set(k,String(v))},console,setInterval:()=>0,clearTimeout:()=>{}};
          ctx.window.__emojiDropsCore={state:()=>({balance:0,inventory:[],market:[],stats:{opens:0,wins:0,spent:0,earned:0,upgrades:0},xp:0,level:1,lastReward:Date.now(),bonusDay:'',bonusClaims:0}),render:()=>{}};
          vm.createContext(ctx); vm.runInContext(fs.readFileSync('js/emoji-drops-hardening.js','utf8'),ctx); const d=ctx.window.__emojiDropsDiagnostics; if(d.runtime!=='hardened-v9'||d.startBalance!==250||d.maxBonusClaims!==3)throw Error('hardening contract'); vm.runInContext(fs.readFileSync('js/emoji-drops-runtime-guards.js','utf8'),ctx); const g=ctx.window.__emojiDropsRuntimeGuards; if(g.version!==4||g.actionLockMs!==650)throw Error('guard contract'); console.log('Guards OK');
          NODE
      - name: UI polish contract
        run: |
          node --check js/emoji-drops-ui-polish.js
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('js/emoji-drops-ui-polish.js','utf8');
          for(const x of ['ed-online','ed-coin','live-section','Emoji Coin']) if(!s.includes(x)) throw new Error('UI polish marker missing: '+x);
          console.log('UI polish OK');
          NODE
