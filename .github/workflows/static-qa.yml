name: EmojiDrops static QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          set -euo pipefail
          find js tests -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          node --check js/data.js
      - name: Assets and boot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(); refs=re.findall(r"<script[^>]+src=['\"]([^'\"]+)",h,re.I)
          missing=[x for x in refs if not x.split('?',1)[0].startswith(('http://','https://','//','data:')) and not Path(x.split('?',1)[0].lstrip('/')).exists()]
          if missing: raise SystemExit('Missing assets: '+str(missing))
          a=Path('js/app-v2.js').read_text(); order=['emoji-drops-schema-migration.js','emoji-drops-data-bridge.js','emoji-drops-hardening.js','emoji-drops-core.js','emoji-drops-transaction-layer.js','emoji-drops-runtime-guards.js','emoji-drops-final-hardening.js','emoji-drops-release-polish.js','emoji-drops-product-layer.js','emoji-drops-product-plus.js','emoji-drops-action-resilience.js','emoji-drops-quality-final.js','emoji-drops-p3-polish.js','emoji-drops-p4-final.js','emoji-drops-case-showcase-exact.js','emoji-drops-exact-landscape-polish.js','emoji-drops-case-authority-v2.js','emoji-drops-case-open-bridge.js','emoji-drops-reference-v23-studio.js','emoji-drops-reference-v19-exact-transaction.js']
          m=re.search(r"const files=\[(.*?)\];",a,re.S)
          if not m: raise SystemExit('Runtime files manifest missing')
          runtime=[Path(x).name for x in re.findall(r"['\"]([^'\"]+\.js)(?:\?[^'\"]*)?['\"]",m.group(1))]
          positions=[runtime.index(x) if x in runtime else -1 for x in order]
          if any(x<0 for x in positions) or positions!=sorted(positions): raise SystemExit('Runtime order failed: '+str(list(zip(order,positions))))
          for v in ['schema-1','data-bridge-1','supabase-auth-4','hardening-9','core-13','txn-11','guards-8','final-2','release-1','product-5','product-plus-6','action-20','quality-final-1','p3-polish-v8','p4-3','v23-stability-1','exact-landscape-1','case-showcase-exact-7','authority-7','case-open-bridge-24','studio-32','exact-txn-1','case-button-bridge-5','authority-finalizer-6','market-v26-4','market-authority-final-1','smooth-ui-3','final-product-polish-6','modal-finalizer-10','upgrade-final-18','upgrade-interaction-guard-5','final-ux-v5','live-final-4','p5-final-audit-1']:
              if v not in a: raise SystemExit('Cache version missing: '+v)
          market=Path('js/emoji-drops-market-v26.js').read_text()
          txlayer=Path('js/emoji-drops-transaction-layer.js').read_text()
          for dead_marker in ['emojiDropsLocalMarketV1','function install(){return;','data-cancel-market','market-cancel']:
              if dead_marker in market or dead_marker in txlayer: raise SystemExit('Obsolete transaction/market compatibility marker still loaded: '+dead_marker)
          for marker in ['version:10','PHASE','run(label,executor,apply)','leaseOwnershipVerified:true','faultAware:true']:
              if marker not in txlayer: raise SystemExit('Transaction lifecycle contract missing: '+marker)
          for dead in ['js/emoji-drops-case-showcase.js','js/emoji-drops-case-showcase-final.js','js/emoji-drops-case-showcase-override.js','js/emoji-drops-case-authority.js']:
              if Path(dead).exists(): raise SystemExit('Legacy case file still present: '+dead)
          for dead in ['emoji-drops-ui-polish-v2.js','emoji-drops-main-reference-v2.js','emoji-drops-layout-v3.js','emoji-drops-reference-v5.js','emoji-drops-reference-interaction-fix.js','emoji-drops-reference-v8-luxe.js','emoji-drops-reference-v9-hitfix.js','emoji-drops-reference-v10-stability.js','emoji-drops-reference-v11-modal-reset.js','emoji-drops-reference-v13-fixed-action.js','emoji-drops-reference-v15-case-precedence.js','emoji-drops-reference-v18-modal-cleanup.js','emoji-drops-reference-v20-studio.js']:
              if dead in a: raise SystemExit('Legacy visual layer still loaded: '+dead)
          ref=Path('js/emoji-drops-reference-v23-studio.js').read_text()
          for marker in ['v23','ed-profile-hub','ed-studio-page','LIVE','min-height:48px','min-width:50px']:
              if marker not in ref: raise SystemExit('v23 visual contract missing: '+marker)
          for n in [1,2,3]:
              if not Path(f'assets/emoji-drops/sprite-{n}.b64').exists(): raise SystemExit(f'Missing reference sprite chunk: {n}')
          for n in ['smile','nature','food']:
              if not Path(f'assets/emoji-drops/live-{n}.b64').exists(): raise SystemExit(f'Missing Live Drops artwork: {n}')
          if not Path('assets/emoji-drops/smile.b64').exists(): raise SystemExit('Missing exact Smile modal artwork')
          exact=Path('js/emoji-drops-case-showcase-exact.js').read_text()
          for marker in ['version:5','aria-modal="true"','case-open','translateX','role="dialog"','₽','Case items']:
              if marker not in exact: raise SystemExit('Exact showcase contract missing: '+marker)
          landscape=Path('js/emoji-drops-exact-landscape-polish.js').read_text()
          for marker in ['orientation:landscape','max-height:500px','position:sticky','.edx-open button']:
              if marker not in landscape: raise SystemExit('Exact landscape contract missing: '+marker)
          tx=Path('js/emoji-drops-reference-v19-exact-transaction.js').read_text()
          for marker in ['v19','tx.acquire','tx.begin','tx.commit','tx.rollback','leaseOwner=true']:
              if marker not in tx: raise SystemExit('Exact transaction contract missing: '+marker)
          PY
          node tests/emoji-drops-static-audit-v3.js
      - name: Code quality and engineering audit
        run: node tests/emoji-drops-engineering-audit.js
      - name: Economy
        run: node tests/emoji-drops-economy-self-test.js
      - name: Economy final gate
        run: node tests/emoji-drops-economy-final-gate.js
      - name: Runtime hardening
        run: node tests/emoji-drops-runtime-hardening-self-test.js
      - name: Transaction layer
        run: node tests/emoji-drops-transaction-self-test.js
      - name: Reliability recovery and storage faults
        run: node tests/emoji-drops-reliability-self-test.js
      - name: Final quality invariants
        run: node tests/emoji-drops-final-quality-self-test.js
      - name: Release economy currency UX
        run: node tests/emoji-drops-release-polish-self-test.js
      - name: Product quality
        run: node tests/emoji-drops-product-self-test.js
      - name: Product-plus workflows
        run: node tests/emoji-drops-product-plus-self-test.js
      - name: Action resilience
        run: node tests/emoji-drops-action-resilience-self-test.js
      - name: P3/P4 contracts
        run: node tests/emoji-drops-p3-p4-self-test.js
      - name: Supabase schema security and atomicity audit
        run: node tests/emoji-drops-supabase-schema-audit.js
      - name: Security/privacy audit
        run: node tests/emoji-drops-security-audit.js
      - name: Final hardening contract
        run: node -e "const fs=require('fs');const s=fs.readFileSync('js/emoji-drops-final-hardening.js','utf8');for(const x of ['aria-live','aria-modal','Escape','focus-trap','PerformanceObserver','storageHealth','stateHealth'])if(!s.includes(x))throw Error(x);console.log('Final hardening contract OK')"
      - name: Browser dependencies
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 axe-core@4.13.0
          npx playwright install --with-deps chromium
      - name: Focused case diagnostic
        run: node tests/emoji-drops-case-diagnostic.js
      - name: Browser E2E matrix
        run: node tests/emoji-drops-browser-e2e.js
      - name: Upgrade E2E
        run: node tests/emoji-drops-upgrade-e2e-v2.js
      - name: Accessibility E2E
        run: node tests/emoji-drops-accessibility-e2e.js
      - name: Performance lifecycle diagnostic
        run: node tests/emoji-drops-performance-diagnose.js
      - name: Performance budget E2E
        run: node tests/emoji-drops-performance-budget-e2e.js
      - name: Mobile responsive and touch E2E
        run: node tests/emoji-drops-mobile-e2e.js
      - name: Recovery and multi-tab E2E
        run: node tests/emoji-drops-recovery-e2e.js
      - name: Security audit
        run: node tests/emoji-drops-security-audit.js
      - name: P2-P4 architecture audit
        run: node tests/emoji-drops-architecture-audit.js
      - name: P2-P4 visual regression smoke
        run: node tests/emoji-drops-visual-regression-smoke.js
      - name: Production smoke
        run: node tests/emoji-drops-production-smoke.js
      - name: Final P2/P3 contract smoke
        run: node tests/emoji-drops-p5-p3-self-test.js
