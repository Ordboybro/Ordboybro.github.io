name: EmojiDrops static QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Workflow bootstrap
        run: |
          set -euo pipefail
          node --version
          test -f index.html
          test -f js/app-v2.js
          echo "QA workflow bootstrap OK"

# FULL_QA_BACKUP_BASELINE: preserved in git history before temporary workflow bootstrap.
