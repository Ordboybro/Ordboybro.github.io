name: EmojiDrops static QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0 | sort -z)

  html-assets-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate local script/style references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, re.I)
          refs += re.findall(r'<link[^>]+href=["\']([^"\']+\.css)["\']', html, re.I)

          missing = []
          for ref in refs:
              clean = ref.split('?', 1)[0].split('#', 1)[0]
              if clean.startswith(('http://', 'https://', '//', 'data:')):
                  continue
              if not Path(clean.lstrip('/')).exists():
                  missing.append(ref)

          if missing:
              print('Missing local assets:')
              for ref in missing:
                  print(' -', ref)
              raise SystemExit(1)
          print(f'Checked {len(refs)} local script/style references.')
          PY
      - name: Enforce one runtime entry point
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, re.I)
          runtime = [x.split('?',1)[0] for x in scripts if 'app-v2.js' in x]
          if runtime != ['js/app-v2.js']:
              raise SystemExit(f'Unexpected runtime entry points: {runtime}')
          app = Path('js/app-v2.js').read_text(encoding='utf-8')
          if 'emoji-drops-core.js' not in app or 'emoji-drops-hardening.js' not in app:
              raise SystemExit('Authoritative runtime chain is incomplete')
          forbidden = ['product-quality.js','visual-restoration.js','final-polish.js','case-expansion.js','system-overhaul']
          loaded = [x for x in forbidden if x in html or x in app]
          if loaded:
              raise SystemExit(f'Legacy runtime layers still referenced: {loaded}')
          print('Single-runtime architecture OK.')
          PY
      - name: Validate declared rarity odds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          js = Path('js/emoji-drops-core.js').read_text(encoding='utf-8')
          m = re.search(r'const R=\{([^}]+)\}', js)
          if not m:
              raise SystemExit('Rarity table not found')
          nums = [int(x) for x in re.findall(r'w:(\d+)', m.group(1))]
          if sum(nums) != 100 or len(nums) != 5:
              raise SystemExit(f'Rarity odds must be 5 tiers totaling 100; got {nums}')
          print('Rarity odds OK:', nums)
          PY
