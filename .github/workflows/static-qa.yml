name: EmojiDrops static QA
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find js tests -type f -name '*.js' -print0 | sort -z)
          node --check data.js
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          h=Path('index.html').read_text()
          for i,src in enumerate(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',h,re.I),1):
              if not src.strip(): continue
              p=Path(f'/tmp/emoji-inline-{i}.js');p.write_text(src)
              subprocess.run(['node','--check',str(p)],check=True)
          print('Inline JavaScript syntax OK')
          PY
      - name: Runtime and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text()
          refs=re.findall(r'<script[^>]+src=["\']([^"\']+)',h,re.I)+re.findall(r'<link[^>]+href=["\']([^"\']+\.css)',h,re.I)
          missing=[x for x in refs if not x.split('?',1)[0].startswith(('http://','https://','//','data:')) and not Path(x.split('?',1)[0].lstrip('/')).exists()]
          if missing: raise SystemExit('Missing assets: '+str(missing))
          app=Path('js/app-v2.js').read_text()
          if not (app.index('emoji-drops-hardening.js')<app.index('emoji-drops-core.js')<app.index('emoji-drops-runtime-guards.js')): raise SystemExit('Runtime order must be hardening -> core -> guards')
          if '<scr' not in app or '<\\/scr' not in app: raise SystemExit('Runtime loader is not parser-safe')
          if 'dataset-bridge' not in app or 'window.cases=cases' not in app or 'window.casePrices=casePrices' not in app: raise SystemExit('Dataset bridge missing')
          bootstrap=Path('data.js').read_text()
          if 'src="js/data.js' not in bootstrap: raise SystemExit('Dataset bootstrap target missing')
          if 'src="data.js' in bootstrap: raise SystemExit('Root data.js recursively loads itself')
          if '<scr' not in bootstrap or '<\\/scr' not in bootstrap: raise SystemExit('Dataset bootstrap is not parser-safe')
          runtime=[x.split('?',1)[0] for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',h,re.I) if 'app-v2.js' in x]
          if runtime!=['js/app-v2.js']: raise SystemExit('Unexpected runtime entry')
          print('Runtime/assets/bootstrap OK')
          PY
      - name: Boot contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const writes=[];
          const document={write:s=>writes.push(s),getElementById:()=>null,head:{appendChild:()=>{}},addEventListener:()=>{}};
          const window={cases:null,casePrices:null,rarities:null};
          const ctx={window,document,localStorage:{getItem:()=>null,setItem:()=>{}},console,getUsers:()=>[],setInterval:()=>0,clearInterval:()=>{}};
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('js/data.js','utf8')+'\nthis.__dataset={cases,casePrices,rarities};',ctx,{timeout:2000});
          if(!ctx.__dataset?.cases||!ctx.__dataset?.casePrices)throw new Error('Canonical dataset bindings missing');
          vm.runInContext(fs.readFileSync('js/app-v2.js','utf8'),ctx,{timeout:2000});
          if(!window.cases||Object.keys(window.cases).length!==8)throw new Error('Dataset bridge did not expose 8 cases');
          if(!window.casePrices||Object.keys(window.casePrices).length!==8)throw new Error('Dataset bridge did not expose 8 case prices');
          if(writes.length!==3||!writes[0].includes('emoji-drops-hardening.js')||!writes[1].includes('emoji-drops-core.js')||!writes[2].includes('emoji-drops-runtime-guards.js'))throw new Error('Runtime loader order failed: '+writes.join(' | '));
          console.log('Boot contract OK: dataset -> bridge -> hardening -> core -> guards');
          NODE
      - name: Odds, dataset and economy
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const core=fs.readFileSync('js/emoji-drops-core.js','utf8');
          const m=core.match(/const R=\{([\s\S]*?)\};/); if(!m) throw new Error('Rarity table missing');
          const odds=[...m[1].matchAll(/w:(\d+)/g)].map(x=>+x[1]); if(odds.length!==5||odds.reduce((a,b)=>a+b,0)!==100) throw new Error('Invalid rarity odds: '+odds);
          const ctx={window:{},document:{getElementById:()=>null},localStorage:{getItem:()=>null,setItem:()=>{}},console,getUsers:()=>[]};
          vm.createContext(ctx); vm.runInContext(fs.readFileSync('data.js','utf8')+'\nthis.__dataset={cases,casePrices};',ctx,{timeout:2000});
          const {cases,casePrices}=ctx.__dataset,rar=['common','rare','epic','mythical','legendary'],w={common:.55,rare:.27,epic:.12,mythical:.05,legendary:.01}; let total=0;
          for(const [key,list] of Object.entries(cases)){if(!Array.isArray(list)||!list.length)throw new Error(key+': empty');if(!(casePrices[key]>0))throw new Error(key+': bad case price');const seen=new Set(),by={};for(const x of list){total++;if(!rar.includes(x.rarity))throw new Error(key+': bad rarity');const v=Number.parseFloat(String(x.price).replace(/[^0-9.\-]/g,''));if(!Number.isFinite(v)||v<0)throw new Error(key+': bad item price');const fp=`${x.emoji}|${x.rarity}|${x.price}`;if(seen.has(fp))throw new Error(key+': duplicate item');seen.add(fp);(by[x.rarity]??=[]).push(v)}for(const r of rar)if(!by[r]?.length)throw new Error(key+': missing '+r);const ev=rar.reduce((s,r)=>s+w[r]*(by[r].reduce((a,b)=>a+b,0)/by[r].length),0),ratio=ev/casePrices[key];if(!(ratio>0&&ratio<2.5))throw new Error(key+': suspicious EV ratio '+ratio.toFixed(3));console.log(`${key}: price=${casePrices[key]} EV=${ev.toFixed(2)} ratio=${ratio.toFixed(3)}`)}
          console.log('Dataset/economy OK:',Object.keys(cases).length,'cases',total,'items');
          NODE
      - name: 11/10 deterministic gameplay simulation
        run: node tests/emoji-drops-economy-self-test.js
      - name: Hardening and guard contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),storage=new Map(),ctx={window:{cases:{},casePrices:{smile:100,moves:80,nature:60,food:40,animals:20,transport:10,sport:250,games:500}},document:{getElementById:()=>null,addEventListener:()=>{},querySelector:()=>null},localStorage:{getItem:k=>storage.get(k)??null,setItem:(k,v)=>storage.set(k,String(v))},Date,Number,JSON,console,setInterval:()=>0,clearTimeout:()=>{}};
          ctx.window.addEventListener=()=>{};ctx.window.__emojiDropsCore={state:()=>({balance:0,inventory:[],market:[],stats:{opens:0,wins:0,spent:0,earned:0,upgrades:0},xp:0,level:1,lastReward:Date.now(),bonusDay:'',bonusClaims:0}),render:()=>{}};
          vm.createContext(ctx);vm.runInContext(fs.readFileSync('js/emoji-drops-hardening.js','utf8'),ctx,{timeout:2000});
          const d=ctx.window.__emojiDropsDiagnostics;if(!d||d.schemaVersion!==3||d.totalOdds!==100||d.runtime!=='hardened-v7'||d.startBalance!==250||d.maxBonusClaims!==3)throw new Error('Hardening contract failed');
          if(typeof ctx.window.__emojiDropsExportState!=='function')throw new Error('Export hook missing');
          vm.runInContext(fs.readFileSync('js/emoji-drops-runtime-guards.js','utf8'),ctx,{timeout:2000});
          const g=ctx.window.__emojiDropsRuntimeGuards;if(!g||g.version!==1||typeof g.claimDue!=='function'||typeof g.eligible!=='function')throw new Error('Runtime guard contract failed');
          console.log('Hardening/guards OK: 250 start, low-balance bonus, max 3/day, legacy timer blocked');
          NODE
