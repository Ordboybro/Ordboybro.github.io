name: EmojiDrops browser smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/emoji-drops-http.log 2>&1 &
          echo $! >/tmp/emoji-drops-http.pid
      - name: Run browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            await page.addInitScript(() => {
              const u={email:'qa-browser@example.test',nickname:'QA',balance:100000,inventory:[],stats:{opened:0,upgrades:0,spent:0,received:0}};
              localStorage.setItem('users',JSON.stringify([u]));
              localStorage.setItem('currentUser',u.email);
            });
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:60000});
            try{
              await page.waitForFunction(()=>window.__emojiDropsEngine && window.__emojiDropsQA,{timeout:30000});
            }catch(e){
              const diag=await page.evaluate(()=>({scripts:[...document.scripts].map(s=>s.src),engine:!!window.__emojiDropsEngine,qa:window.__emojiDropsQA||null,perf:window.__emojiDropsPerf||null}));
              throw new Error('runtime boot timeout: '+JSON.stringify({diag,errors}));
            }
            const qa=await page.evaluate(()=>({qa:window.__emojiDropsQA,econ:window.__emojiDropsEconomyQA,guard:window.__emojiDropsTxGuard,engine:window.__emojiDropsEngine}));
            if(!qa.engine) throw new Error('transaction engine missing');
            if(!qa.qa?.ok) throw new Error('runtime QA failed: '+JSON.stringify(qa.qa?.failedCount??'?'));
            if(qa.econ?.errors?.length) throw new Error('economy QA failed: '+JSON.stringify(qa.econ.errors));
            if(qa.guard?.mode!=='legacy-recovery-only') throw new Error('unexpected transaction guard mode');
            if(await page.locator('.case-card').count()!==8) throw new Error('expected 8 case cards');
            if(await page.locator('#edOpenModal').count()!==1 || await page.locator('#edWinModal').count()!==1) throw new Error('case modals missing');
            if(await page.locator('#edUpgradeModal').count()!==1 || await page.locator('#edDoUpgrade').count()!==1) throw new Error('upgrade controls missing');

            const caseTrigger=page.locator('[data-ed-case]').first();
            if(await page.locator('[data-ed-case]').count()===0) throw new Error('case trigger missing');
            await caseTrigger.click();
            const caseState=await page.evaluate(()=>window.__emojiDropsEngine.state.caseKey);
            if(!caseState) throw new Error('case trigger did not select a case');
            await page.evaluate(()=>window.__emojiDropsEngine.openCase());
            await page.waitForFunction(()=>JSON.parse(localStorage.getItem('users')||'[]')[0]?.stats?.opened===1,{timeout:10000});
            const afterCase=await page.evaluate(()=>JSON.parse(localStorage.getItem('users'))[0]);
            if(afterCase.inventory.length!==1 || afterCase.balance>=100000) throw new Error('case transaction did not commit correctly');
            if(await page.evaluate(()=>localStorage.getItem('emojiDrops.engineTx.v2'))!==null) throw new Error('case journal was not cleared');

            await page.evaluate(()=>{const e=window.__emojiDropsEngine;e.state.sourceIndex=0;e.state.targetIndex=null;e.state.mult=5;e.refreshUI()});
            if(await page.locator('#edTargets .ed-final-item-btn').count()===0) throw new Error('no upgrade target available');
            await page.evaluate(()=>{window.__emojiDropsEngine.state.targetIndex=0;window.__emojiDropsEngine.upgrade()});
            await page.waitForFunction(()=>JSON.parse(localStorage.getItem('users')||'[]')[0]?.stats?.upgrades===1,{timeout:5000});
            const afterUpgrade=await page.evaluate(()=>JSON.parse(localStorage.getItem('users'))[0]);
            if(afterUpgrade.stats.upgrades!==1) throw new Error('upgrade transaction did not commit');
            if(await page.evaluate(()=>localStorage.getItem('emojiDrops.engineTx.v2'))!==null) throw new Error('upgrade journal was not cleared');
            if(errors.length) throw new Error('browser console errors: '+errors.join(' | '));
            console.log('BROWSER SMOKE PASS');
            await browser.close();
          })().catch(async e=>{console.error(e);process.exit(1)});
          NODE
